  <div class="row">${inp("bank",L("Tasso conto in banca %","Bank account rate %"),"0",1)}${inp("corr",L("Correlazione tra classi (0–1)","Correlation between classes (0–1)"),"0,3",1)}</div>
  ${chk("real",L("Mostra potere d'acquisto di oggi (toglie l'inflazione)","Show today's purchasing power (removes inflation)"))}${chk("mc",L("Mostra incertezza (200 scenari casuali)","Show uncertainty (200 random scenarios)"))}</div>`;
  if(R.rBank)h+=`<div class="card" style="margin-top:12px;border-color:var(--mut)"><div class="mini" style="margin-bottom:6px">${L("Soldi fermi in banca, senza investire","Money left in the bank, not invested")}</div><div class="row">${inp("bankC",L("Capitale in banca (EUR)","Capital in the bank (EUR)"),"10000",1)}${inp("bankM",L("Versamento mensile in banca (EUR)","Monthly deposit (EUR)"),"0",1)}</div></div>`;
  h+=`<div class="card" style="margin-top:12px;border-color:var(--acc)">${chk("pic","<b>PIC</b> – "+L("tutto subito","all at once"))}${SIM.pic?inp("picC",L("Capitale iniziale (EUR)","Initial capital (EUR)"),"10000"):""}</div>`;
  h+=`<div class="card" style="margin-top:12px;border-color:var(--c2)">${chk("pac","<b>PAC</b> – "+L("un po' ogni mese","a bit every month"))}${SIM.pac?`<div class="row">${inp("pacM",L("Versamento mensile (EUR)","Monthly contribution (EUR)"),"200",1)}${inp("pacY",L("Per quanti anni (0 = tutto l'orizzonte)","For how many years (0 = whole horizon)"),"0",1)}</div>${inp("pacC",L("Capitale iniziale del PAC (EUR, facoltativo)","Initial capital of the PAC (EUR, optional)"),"0")}`:""}</div>`;
  // allocazione
  h+=`<h2 class="gt">${L("Asset allocation","Asset allocation")}</h2><p class="mini">${L("Per ogni classe: peso, rendimento annuo atteso e volatilità. I valori di partenza sono medie storiche indicative, cambiali come credi.","For each class: weight, expected yearly return and volatility. Defaults are rough historical averages; change them as you like.")}</p>
  <div class="row" style="margin-bottom:8px"><select id="simpre" style="flex:1;margin:0"><option value="">${L("Carica un modello…","Load a preset…")}</option>${SIM_PRESETS.map(([id,n])=>`<option value="${id}">${n}</option>`).join("")}</select><button class="ghost" data-a="simmine" style="white-space:nowrap">${L("Dal mio portafoglio","From my portfolio")}</button></div>
  <div class="card ug"><div class="arow ah"><span>${L("Classe","Class")}</span><span>${L("Peso %","Weight %")}</span><span>${L("Rend. %","Return %")}</span><span>${L("Vol. %","Vol. %")}</span><span></span></div>`
    +SIM.alloc.map((a,i)=>`<div class="arow"><input data-al="${i}:0" value="${esc(a[0])}"><input data-al="${i}:1" inputmode="decimal" value="${esc(String(a[1]))}"><input data-al="${i}:2" inputmode="decimal" value="${esc(String(a[2]))}"><input data-al="${i}:3" inputmode="decimal" value="${esc(String(a[3]))}"><button class="ghost" data-a="saldel" data-i="${i}" style="padding:4px 6px">✕</button></div>`).join("")
    +`</div><p style="margin-top:8px"><button class="ghost" data-a="saladd">${L("+ Aggiungi classe","+ Add class")}</button></p>`;
  h+=`<p class="mini">${L("Ipotesi: rendimenti costanti e portafoglio ribilanciato ogni mese; inflazione costante; tasse pagate solo alla fine sul guadagno; nel PAC i versamenti avvengono a inizio mese. È una stima, non una previsione.","Assumptions: constant returns and a monthly rebalanced portfolio; constant inflation; taxes paid only at the end on the gain; PAC contributions at the start of each month. It is an estimate, not a forecast.")}</p>`;
  $("sim").innerHTML=h;
}
function simMine(){                                                               // capitale e pesi presi dagli asset finanziari attuali
  const rows=FIN().map(([id,n])=>[n,totCatIn(S.m,id,"EUR")]).filter(x=>x[1]>0),T=rows.reduce((a,x)=>a+x[1],0);
  if(!T){say_sim(L("Non hai ancora asset finanziari con un valore.","You have no financial assets with a value yet."));return;}
  const def={azioni:[7,15],obbl:[3,5],altro:[4,15]};
  SIM.alloc=FIN().map(([id,n])=>[n,totCatIn(S.m,id,"EUR")]).filter(x=>x[1]>0).map(([n,v])=>{const k=FIN().find(c=>c[1]===n)[0],d=def[k]||[5,10];return [n,Math.round(v/T*1000)/10,d[0],d[1]];});
  SIM.pic=true;SIM.picC=Math.round(T);simSave();renderSim();
}
const say_sim=m=>{const e=$("sim").querySelector("h1");if(e){const p=document.createElement("p");p.className="mini";p.style.color="var(--err)";p.textContent=m;e.after(p);}};

/* ---------- configurazione guidata: i passi per riempire un account nuovo, con avanzamento automatico ---------- */
const SETUP=[
 {id:"liq",t:["Conti e contanti","Accounts and cash"],b:["Vai in Liquidità e aggiungi una voce per ogni conto corrente, conto deposito e per i contanti, con il saldo di oggi.","Go to Cash and add one item per bank account, deposit account and for cash, with today's balance."],a:"cat",c:"liq",done:()=>S.data.items.some(i=>i.cat==="liq")},
 {id:"inv",t:["Investimenti","Investments"],b:["In Azioni e ETF, Obbligazioni o Altri investimenti aggiungi i tuoi titoli: cercali per nome o codice e scrivi quante quote possiedi. Per fondi pensione o strumenti senza prezzo usa Altro e scrivi il valore.","In Stocks and ETFs, Bonds or Other investments add your securities: search them by name or ticker and type how many units you own. For pension funds or unpriced products use Other and type the value."],a:"cat",c:"azioni",done:()=>S.data.items.some(i=>TKCAT.includes(i.cat))},
 {id:"beni",t:["Beni di valore","Valuables"],b:["Oro, auto, collezioni: in Beni di valore, con una stima del valore. Se non ne hai, salta questo passo.","Gold, car, collections: in Valuables, with an estimated value. If you have none, skip this step."],a:"cat",c:"beni",opt:true,done:()=>S.data.items.some(i=>i.cat==="beni")},
 {id:"valid",t:["Categorie e parole delle spese","Expense categories and words"],b:["In Parole e categorie elimina le parole di esempio, sistema le categorie con i loro colori e aggiungi le parole che usi davvero (supermercato, benzina…). Le parole nuove si possono aggiungere anche al volo mentre inserisci una spesa.","In Words and categories delete the sample words, arrange the categories with their colours and add the words you really use (grocery, fuel…). New words can also be added on the fly while entering an expense."],a:"valid",done:()=>!!CFG.setupValid},
 {id:"inc",t:["Entrate","Income"],b:["In Entrate inserisci lo stipendio di questo mese. Le categorie (Stipendio, Extra…) si cambiano in Parole e categorie.","In Income add this month's salary. Categories (Salary, Extra…) are changed in Words and categories."],a:"inc",done:()=>INC().length>0},
 {id:"exp",t:["Prima spesa","First expense"],b:["In Inserisci spesa registra una spesa di oggi: così vedi come funzionano parola, categoria e lista.","In Add expense record an expense from today: you'll see how word, category and list work."],a:"exp",done:()=>EXP().length>0},
 {id:"bk",t:["Backup e promemoria","Backup and reminder"],b:["In Impostazioni scarica un primo backup con Esporta dati e aggiungi al calendario il promemoria mensile.","In Settings download a first backup with Export data and add the monthly reminder to your calendar."],a:"set",done:()=>!!LS.get("exported:"+uid,0)}];
const setupSkip=()=>LS.get("setupskip:"+uid,[]);
const setupState=()=>{const sk=setupSkip();const st=SETUP.map(x=>({...x,ok:x.done()||sk.includes(x.id)}));return {st,n:st.filter(x=>x.ok).length,tot:st.length};};
function renderSetup(){
  const {st,n,tot}=setupState();
  let h=`<div class="hd"><div class="top"><button class="ghost" data-a="home">‹ Home</button><span class="mini">${S.y}</span></div><h1 style="font-size:1.5rem;margin:14px 0 0">${ic("set")}${L("Configurazione guidata","Guided setup")}</h1></div>
  <p class="mini">${L("I passi per riempire l'app con i tuoi dati, nell'ordine giusto. Si spuntano da soli quando li completi; quelli facoltativi puoi saltarli.","The steps to fill the app with your data, in the right order. They tick themselves when you complete them; optional ones can be skipped.")}</p>
  <div class="card"><div class="row" style="justify-content:space-between"><b>${n} / ${tot}</b><span class="mini">${n===tot?L("Tutto fatto","All done"):L("passi completati","steps completed")}</span></div><div class="bar" style="margin-top:8px"><i style="width:${n/tot*100}%"></i></div>
  ${n<tot?`<div class="row" style="margin-top:14px"><button class="ghost" data-a="acct" style="flex:1">${L("Ho già un file: importa","I have a file: import")}</button><button class="ghost" data-a="setupall">${L("Salta tutto","Skip all")}</button></div>`:""}</div>`;
  h+=st.map((x,i)=>`<div class="card" style="margin-top:10px${x.ok?";opacity:.75":""}"><div class="row" style="justify-content:space-between;align-items:baseline"><b>${x.ok?"✓ ":""}${i+1}. ${T(x.t)}</b>${x.opt?`<span class="mini">${L("facoltativo","optional")}</span>`:""}</div>
    <p class="mini" style="margin:6px 0 10px">${T(x.b)}</p><div class="row"><button class="${x.ok?"ghost":"go"}" data-a="${x.a}"${x.c?` data-c="${x.c}"`:""} style="width:auto;padding:10px 16px">${x.ok?L("Riapri","Open again"):L("Vai","Go")}</button>${!x.ok?`<button class="ghost" data-a="setupskip" data-id="${x.id}">${L("Salta","Skip")}</button>`:""}</div></div>`).join("");
  $("setup").innerHTML=h;
}
function setupNote(){                                             // riquadro in home finché la configurazione non è completa
  if(LS.get("setuphide:"+uid,0))return "";const {n,tot}=setupState();if(n===tot)return "";
  return `<div class="card note" style="border-left-color:var(--acc)"><b>${L("Configurazione guidata","Guided setup")}: ${n} / ${tot}</b><div class="bar" style="margin:8px 0 10px"><i style="width:${n/tot*100}%"></i></div><div class="row"><button class="go" data-a="setup" style="width:auto;padding:10px 16px">${L("Continua","Continue")}</button><button class="ghost" data-a="setuphide">${L("Nascondi","Hide")}</button></div></div>`;
}

/* ---------- tutorial: lampadina in ogni pagina, guida completa, benvenuto ---------- */
// Ogni voce: titolo [it,en] e sezioni {h: titolo [it,en], b: testo [it,en]}
const HELP={
 home:{t:["Home","Home"],s:[
  {h:["Cosa vedi","What you see"],b:["Il patrimonio netto del mese scelto, con la variazione rispetto al mese prima (verde se sale, rossa se scende). Sotto, le cinque categorie con il loro totale e il pulsante Asset finanziari e ribilancia. Se hai inserito versamenti, una riga separa quanto hai versato da quanto ha fatto il mercato.","Your net worth for the chosen month, with the change versus the previous month (green up, red down). Below, the five categories with their totals and the Financial assets and rebalance button. If you entered deposits, a line separates what you deposited from what the market did."]},
  {h:["Cosa puoi fare","What you can do"],b:["Cambia mese con le frecce e valuta con EUR/USD. Tocca una categoria per vedere e modificare le sue voci. In fondo trovi Aggiorna mese. Quando un mese finisce viene chiuso da solo e un riquadro te lo dice: puoi controllarlo o premere Ok.","Change month with the arrows and currency with EUR/USD. Tap a category to see and edit its items. At the bottom you find Update month. When a month ends it is closed automatically and a box tells you: you can check it or tap Ok."]},
  {h:["Consiglio","Tip"],b:["La home è solo di consultazione: i numeri si cambiano dentro le categorie o, più velocemente, in Aggiorna mese.","The home is read-only: numbers are changed inside the categories or, faster, in Update month."]}]},
 cat:{t:["Categoria","Category"],s:[
  {h:["Cosa vedi","What you see"],b:["Il totale della categoria nel mese scelto e l'elenco delle voci (per esempio un conto o un oggetto di valore), ciascuna con la sua valuta e il valore del mese. Sotto ogni voce due etichette: variazione rispetto al mese prima e da inizio anno.","The category total for the chosen month and the list of items (for example an account or a valuable), each with its currency and the month's value. Under each item, two labels: change versus the previous month and since the start of the year."]},
  {h:["Cosa puoi fare","What you can do"],b:["+ Aggiungi voce crea una voce nuova. Tocca una voce per cambiarne nome, valuta o valore, oppure per eliminarla (il tasto chiede un secondo tocco). I valori negativi sono ammessi, per esempio una carta di credito. Per ogni voce scegli se mostrare le etichette di variazione %: per un conto corrente spesso non dicono nulla, per l'oro sì.","+ Add item creates a new item. Tap an item to change its name, currency or value, or to delete it (the button asks for a second tap). Negative values are allowed, for example a credit card. For each item you choose whether to show the % change labels: for a current account they often mean little, for gold they do."]},
  {h:["Da sapere","Good to know"],b:["Se in un mese non inserisci il valore, la voce mantiene l'ultimo valore inserito: così non devi riscrivere ciò che non cambia.","If you don't enter a value in a month, the item keeps the last value entered: you never retype what hasn't changed."]}]},
 catfin:{t:["Categoria finanziaria","Financial category"],s:[
  {h:["Cosa vedi","What you see"],b:["Il totale della categoria e le voci: titoli con numero di quote (il valore è quote × prezzo) oppure voci con il valore scritto a mano. Sotto ogni voce la variazione rispetto al mese prima e da inizio anno, calcolata sul valore di una quota: così comprare altre quote non sembra un guadagno; in alto la riga del cambio EUR/USD e, se hai inserito versamenti, la riga versato/mercato.","The category total and its items: securities with a number of units (value = units × price) or items with a hand-written value. Under each item the change versus the previous month and since the start of the year, computed on the value of one unit: buying more units never looks like a gain; at the top the EUR/USD line and, if you entered deposits, the deposited/market line."]},
  {h:["Aggiungere un titolo","Adding a security"],b:["In + Aggiungi voce scegli il titolo dal menu, oppure cercalo per nome o codice con Cerca: nome, valuta e prezzo li imposta l'app, tu scrivi solo le quote. Con Personalizzato inserisci a mano anche il prezzo di una quota. Con Altro inserisci il valore totale.","In + Add item pick the security from the menu, or search it by name or ticker with Search: the app sets name, currency and price, you only type the units. With Custom you also type the unit price yourself. With Other you enter the total value."]},
  {h:["Prezzi","Prices"],b:["Nel mese in corso il valore segue il prezzo attuale (Aggiorna prezzi in home). I mesi passati restano fissi come una fotografia: cambiano solo se li modifichi tu.","In the current month the value follows the live price (Update prices on the home). Past months stay fixed like a snapshot: they change only if you edit them."]}]},
 upd:{t:["Aggiorna mese","Update month"],s:[
  {h:["A cosa serve","What it is for"],b:["Inserire i valori di un mese in pochi secondi: tutte le voci in una sola schermata, raggruppate per categoria. Scegli il mese con le frecce.","Enter a month's values in seconds: all items on one screen, grouped by category. Pick the month with the arrows."]},
  {h:["Come si usa","How to use it"],b:["Cambia solo i valori che sono cambiati: le voci che non tocchi restano uguali al mese prima. Per i titoli, nel mese in corso scrivi le quote; nei mesi passati il valore. Nella sezione Versamenti e prelievi scrivi i soldi nuovi messi negli investimenti (+) o tolti (−): servono a distinguere il tuo risparmio dal rendimento del mercato.","Change only what changed: untouched items stay equal to the previous month. For securities, type units in the current month and the value in past months. In Deposits and withdrawals, write the new money put into (+) or taken out of (−) investments: it separates your savings from market performance."]},
  {h:["Chiusura del mese","Month close"],b:["Quando un mese finisce l'app lo chiude da sola: i valori restano fissati come una fotografia. Qui puoi riaprirlo, correggere i saldi e premere Salva le correzioni. Dopo il salvataggio compare Scarica backup: usalo.","When a month ends the app closes it by itself: values stay fixed like a snapshot. Here you can reopen it, correct balances and tap Save corrections. After saving, Download backup appears: use it."]}]},
 fin:{t:["Asset finanziari","Financial assets"],s:[
  {h:["Cosa vedi","What you see"],b:["Solo la parte investita: azioni, obbligazioni e altri investimenti, con importo, peso percentuale sul portafoglio e barra. Sotto, se li hai inseriti, versato e mercato del mese.","Only the invested part: stocks, bonds and other investments, with amount, weight on the portfolio and bar. Below, if entered, this month's deposits and market effect."]},
  {h:["Cosa puoi fare","What you can do"],b:["Ribilancia ti dice quanto vendere e comprare per tornare all'allocazione che vuoi. Simulatore PIC e PAC stima come cresce un'allocazione nel tempo, contro i soldi fermi in banca.","Rebalance tells you how much to sell and buy to get back to the allocation you want. The PIC and PAC simulator estimates how an allocation grows over time, versus money left in the bank."]}]},
 reb:{t:["Ribilancia","Rebalance"],s:[
  {h:["Tre modi","Three modes"],b:["In percentuale: scrivi il peso obiettivo di ogni categoria (devono fare 100). In importo: scrivi il valore che vuoi per ciascuna. Solo acquisti: scrivi quanto vuoi investire di nuovo e l'app lo distribuisce dove manca, senza vendere e senza tasse.","By percentage: write each category's target weight (they must add up to 100). By amount: write the value you want for each. Buy only: write how much new money you'll invest and the app spreads it where it's missing, with no selling and no taxes."]},
  {h:["Risultati","Results"],b:["Accanto a ogni categoria: Vendi in rosso o Compra in verde, con la ripartizione per singolo titolo in proporzione al peso e le quote approssimative. La tolleranza ignora scostamenti piccoli. Se hai impostato le tasse, vedi quelle stimate sulle vendite.","Next to each category: Sell in red or Buy in green, with the split by security in proportion to weight and approximate units. The tolerance ignores small deviations. If you set taxes, you see those estimated on sales."]},
  {h:["Da sapere","Good to know"],b:["Gli importi sono nella valuta scelta in home. Gli obiettivi restano salvati per l'anno e passano all'anno nuovo.","Amounts are in the currency chosen on the home. Targets are saved for the year and carry over to the new year."]}]},
 tax:{t:["Tasse sui profitti","Taxes on gains"],s:[
  {h:["A cosa serve","What it is for"],b:["Stimare le tasse che pagheresti vendendo. Scrivi l'aliquota (in Italia il 26%) e, per ogni categoria, il profitto maturato finora (valore attuale meno quanto hai investito).","Estimate the taxes you'd pay when selling. Write the rate (26% in Italy) and, for each category, the gain so far (current value minus what you invested)."]},
  {h:["Da sapere","Good to know"],b:["È una stima: assume che il profitto sia distribuito uniformemente nella categoria. Se non conosci i numeri, Continua senza tasse.","It's an estimate: it assumes the gain is spread evenly across the category. If you don't know the numbers, Continue without taxes."]}]},
 sim:{t:["Simulatore PIC e PAC","Lump sum vs DCA simulator"],s:[
  {h:["Cosa confronta","What it compares"],b:["PIC: investi tutto subito. PAC: versi una cifra ogni mese. La linea tratteggiata sono gli stessi soldi lasciati in banca, erosi dall'inflazione che scegli. Puoi spegnere PIC o PAC; con entrambi spenti vedi solo lo scenario banca.","PIC: invest everything at once. PAC: invest a fixed amount every month. The dashed line is the same money left in the bank, eroded by the inflation you choose. You can switch PIC or PAC off; with both off you only see the bank scenario."]},
  {h:["Parametri","Parameters"],b:["Orizzonte, inflazione, costi annui, tasse sui guadagni, tasso del conto, correlazione tra le classi. L'asset allocation in basso: per ogni classe peso, rendimento atteso e volatilità. Carica un modello o parti dal tuo portafoglio reale.","Horizon, inflation, yearly costs, tax on gains, bank rate, correlation between classes. The asset allocation below: weight, expected return and volatility for each class. Load a preset or start from your real portfolio."]},
  {h:["Incertezza","Uncertainty"],b:["Attiva Mostra incertezza per vedere 200 scenari casuali: la fascia colorata racchiude il 10°–90° percentile e i risultati dicono in quanti scenari batti la banca. È una stima, non una previsione.","Turn on Show uncertainty to see 200 random scenarios: the shaded band covers the 10th–90th percentile and the results tell in how many scenarios you beat the bank. It's an estimate, not a forecast."]}]},
 acct:{t:["Account","Account"],s:[
  {h:["Cosa trovi","What you find"],b:["Le informazioni del tuo account: email, tipo (demo o online), da quando lo usi, quanti anni e dati contiene, lo stato della sincronizzazione e la versione dell'app.","Your account information: email, type (demo or online), since when you use it, how many years and data it holds, sync status and app version."]},
  {h:["Cosa puoi fare","What you can do"],b:["Esporta dati crea il file con tutto (anni, voci, spese, impostazioni), che Importa dati rilegge anche su un altro account. Parole e categorie gestisce le parole delle spese, le categorie con i colori e le categorie delle entrate; Spese ricorrenti le spese automatiche mensili. Cambia password (solo online), le note legali e il pulsante Esci.","Export data creates the file with everything (years, items, expenses, settings), which Import data reads back even on another account. Words and categories manages expense words, categories with colours and income categories; Recurring expenses the monthly automatic ones. Change password (online only), legal notes and the Log out button."]}]},
 set:{t:["Impostazioni","Settings"],s:[
  {h:["Cosa trovi","What you find"],b:["Anno su cui lavori e Cambia anno. Lingua, con le bandiere. Prezzi: aggiornamento manuale e stato dell'ultimo aggiornamento. Notifiche: una al giorno all'ora che scegli per segnare le spese e una il 1° del mese per confermare il mese finito, da attivare dispositivo per dispositivo. Il promemoria da mettere nel calendario. Configurazione guidata, guida completa e benvenuto. In modalità demo, il pulsante per svuotare i dati di prova. Esportazione, importazione, parole e categorie e password sono nella pagina Account.","The year you're working on and Change year. Language, with flags. Prices: manual update and last-update status. Notifications: one a day at the time you choose to log expenses and one on the 1st to confirm the month just ended, enabled device by device. The reminder to add to your calendar. Guided setup, full guide and welcome. In demo mode, the button to clear demo data. Export, import, words and categories and password are on the Account page."]},
  {h:["Consiglio","Tip"],b:["Esporta i dati a ogni fine mese dalla pagina Account: finché l'app lavora solo sul tuo dispositivo, il file è il tuo unico backup.","Export your data at every month end from the Account page: as long as the app works only on your device, that file is your only backup."]}]},
 hist:{t:["Storico","History"],s:[
  {h:["Cosa vedi","What you see"],b:["Il patrimonio netto mese per mese come grafico: una linea in euro e una in dollari, convertita col cambio salvato per ciascun mese. Sopra, l'ultimo mese e la variazione da inizio anno; sotto, la tabella mese per mese.","Your net worth month by month as a chart: one line in euros, one in dollars converted with each month's saved rate. Above, the latest month and the change since the start of the year; below, the month-by-month table."]},
  {h:["Versato e mercato","Deposited and market"],b:["Se inserisci i versamenti in Aggiorna mese, qui vedi quanto della crescita degli asset finanziari è tuo risparmio e quanto è mercato.","If you enter deposits in Update month, here you see how much of the growth of your financial assets is your savings and how much is market."]}]},
 exp:{t:["Inserisci spesa","Add expense"],s:[
  {h:["Come si inserisce","How to add"],b:["Scrivi cosa hai comprato: l'app suggerisce le parole conosciute e compila da sola categoria e sottocategoria. Se la parola è nuova, scegli tu categoria e sottocategoria una volta sola: la ricorderà. Poi importo, data (oggi) e nota.","Write what you bought: the app suggests known words and fills category and subcategory for you. If the word is new, pick category and subcategory once: it will remember. Then amount, date (today) and note."]},
  {h:["Ricorrenti","Recurring"],b:["Spunta Ricorrente per le spese fisse (affitto, abbonamenti): ogni mese vengono inserite da sole nel giorno scelto, segnate con ↻. In fondo l'elenco delle ricorrenti, con la ✕ per toglierle.","Tick Recurring for fixed expenses (rent, subscriptions): every month they're added automatically on the chosen day, marked ↻. At the bottom the list of recurring ones, with ✕ to remove them."]},
  {h:["Lista","List"],b:["Cerca per parola, nota o categoria e filtra per mese. Tocca una spesa per modificarla; per eliminarla il tasto chiede un secondo tocco.","Search by word, note or category and filter by month. Tap an expense to edit it; to delete, the button asks for a second tap."]}]},
 trend:{t:["Andamento spese","Spending trend"],s:[
  {h:["Cosa vedi","What you see"],b:["Il totale speso nel mese con due confronti: rispetto al mese prima e alla media annua (qui il rosso significa che hai speso di più). Poi una riga per categoria; se hai un budget vedi quanto ne hai usato.","Total spent in the month with two comparisons: versus the previous month and versus the yearly average (here red means you spent more). Then one row per category; if you have a budget you see how much of it you used."]},
  {h:["Cosa puoi fare","What you can do"],b:["Tocca una categoria per vedere le sottocategorie. Confronta mesi: scegli i mesi che vuoi, anche tutti, e filtra per categoria per vedere come è andata mese per mese.","Tap a category to see its subcategories. Compare months: pick as many months as you like, even all, and filter by category to see month by month."]}]},
 graph:{t:["Grafico spese","Expense chart"],s:[
  {h:["Come si legge","How to read it"],b:["Ogni barra è un mese, ogni colore una categoria; il numero sopra è il totale. Tocca una barra per il dettaglio di quel mese; tocca una categoria nella legenda per nasconderla. I colori si cambiano in Impostazioni → Parole e categorie.","Each bar is a month, each colour a category; the number above is the total. Tap a bar for that month's detail; tap a category in the legend to hide it. Colours are changed in Settings → Words and categories."]}]},
 inc:{t:["Inserisci entrata","Add income"],s:[
  {h:["Come funziona","How it works"],b:["Scegli la categoria (Stipendio, Extra o le tue), importo, data e nota. In alto il totale del mese con il confronto rispetto al mese prima e alla media annua; sotto le entrate del mese: tocca per modificare.","Pick the category (Salary, Extra or your own), amount, date and note. At the top the month's total compared with the previous month and the yearly average; below, the month's entries: tap to edit."]},
  {h:["Da sapere","Good to know"],b:["Le categorie delle entrate si aggiungono e rinominano in Impostazioni → Parole e categorie.","Income categories are added and renamed in Settings → Words and categories."]}]},
 igraph:{t:["Grafico entrate","Income chart"],s:[
  {h:["Come si legge","How to read it"],b:["Una barra per mese divisa per categoria, con la linea tratteggiata della media annua. Tocca una barra per il dettaglio, una categoria nella legenda per nasconderla.","One bar per month split by category, with the dashed yearly-average line. Tap a bar for the detail, a category in the legend to hide it."]}]},
 sav:{t:["Risparmio","Savings"],s:[
  {h:["Cosa vedi","What you see"],b:["Entrate meno uscite del mese, la percentuale di risparmio e il confronto con il mese prima e con la media annua. Poi i totali dell'anno.","Income minus expenses for the month, the savings rate and the comparison with the previous month and the yearly average. Then the year's totals."]},
  {h:["Indipendenza finanziaria","Financial independence"],b:["L'obiettivo è il capitale che, prelevandone ogni anno la percentuale scelta (3,5% di default), copre le tue spese annue medie. La barra dice a che punto sei e, con il tuo risparmio mensile medio e il rendimento reale del simulatore, tra quanti anni ci arrivi.","The target is the capital that, withdrawing the chosen percentage each year (3.5% by default), covers your average yearly expenses. The bar shows where you are and, with your average monthly savings and the simulator's real return, in how many years you get there."]},
  {h:["Mesi coperti","Months covered"],b:["Quanti mesi di spese medie copre la tua liquidità: è il tuo margine di sicurezza.","How many months of average expenses your cash covers: your safety margin."]}]},
 goals:{t:["Obiettivi","Goals"],s:[
  {h:["Obiettivi personali","Personal goals"],b:["Aggiungi un obiettivo (palestra, dieta, un progetto) e a fine mese tocca la sua casella: verde raggiunto, giallo così così, rosso no. Tocca ancora per cambiare. La ✕ elimina l'obiettivo.","Add a goal (gym, diet, a project) and at month end tap its box: green done, yellow so-so, red no. Tap again to change. ✕ deletes the goal."]},
  {h:["Crescita del patrimonio","Net worth growth"],b:["Scrivi quanto vuoi che cresca il patrimonio nell'anno, in percentuale o in euro. La barra confronta il patrimonio del primo mese con quello dell'ultimo (versamenti compresi): il segno indica il 100% e, se vai oltre, la barra continua e il testo dice di quanto.","Write how much you want your net worth to grow this year, in percent or euros. The bar compares the first month's net worth with the latest (deposits included): the tick marks 100% and, if you go beyond, the bar continues and the text says by how much."]},
  {h:["Budget","Budgets"],b:["Per ogni categoria di spesa scrivi quanto vuoi spendere al massimo ogni mese: la barra si riempie e diventa rossa se sfori. Il budget compare anche in Andamento spese.","For each expense category write the most you want to spend each month: the bar fills and turns red if you go over. Budgets also appear in Spending trend."]}]},
 hof:{t:["Hall of fame","Hall of fame"],s:[
  {h:["Cosa vedi","What you see"],b:["I record tra tutti gli anni salvati su questo dispositivo: massimo storico del patrimonio, mese migliore e peggiore, anno migliore; poi mese con più entrate, meno uscite, più uscite, miglior risparmio, e una tabella anno per anno.","Records across all years saved on this device: all-time high net worth, best and worst month, best year; then the month with the highest income, lowest spending, highest spending, best savings, and a year-by-year table."]}]},
 valid:{t:["Parole e categorie","Words and categories"],s:[
  {h:["Parole","Words"],b:["Ogni parola che usi per le spese ha categoria e sottocategoria: qui le correggi. Se rinomini una parola con il nome di un'altra, le unisci (supermarket → supermercato) e le spese già inserite si aggiornano. Premi Salva modifiche. Con Nuova parola ne aggiungi una scegliendo categoria e sottocategoria; con Elimina le parole di esempio togli quelle di partenza e tieni solo le tue.","Every word you use for expenses has a category and subcategory: fix them here. Renaming a word to another word's name merges them (supermarket → supermercato) and existing expenses update. Tap Save changes. New word adds one with its category and subcategory; Delete the sample words removes the starter ones and keeps only yours."]},
  {h:["Categorie","Categories"],b:["Aggiungi categorie di spesa, cambia nome e colore (il quadratino), eliminale: parole e spese passano in Altro. Più sotto le categorie delle entrate.","Add expense categories, change name and colour (the little square), delete them: words and expenses move to Other. Further down, income categories."]}]},
 setup:{t:["Configurazione guidata","Guided setup"],s:[
  {h:["A cosa serve","What it is for"],b:["Elenca, nell'ordine giusto, i passi per riempire un account nuovo: conti, investimenti, beni, parole e categorie delle spese, entrate, prima spesa, chiave prezzi, backup. Ogni passo ha il pulsante Vai che ti porta nel posto giusto.","Lists, in the right order, the steps to fill a new account: accounts, investments, valuables, expense words and categories, income, first expense, price key, backup. Each step has a Go button that takes you to the right place."]},
  {h:["Avanzamento","Progress"],b:["I passi si spuntano da soli quando li completi; quelli facoltativi si possono saltare. Finché non è completa, in home c'è un riquadro con l'avanzamento, che puoi nascondere.","Steps tick themselves when completed; optional ones can be skipped. Until it's complete, the home shows a progress box, which you can hide."]}]},
 rec:{t:["Spese ricorrenti","Recurring expenses"],s:[
  {h:["Cosa vedi","What you see"],b:["Tutte le spese che l'app inserisce da sola ogni mese: parola, importo, giorno del mese, categoria e sottocategoria, da quando sono attive. Nascono spuntando \"Ricorrente\" quando registri una spesa.","All the expenses the app adds by itself every month: word, amount, day of the month, category and subcategory, and since when they are active. They are created by ticking \"Recurring\" when you record an expense."]},
  {h:["Cosa puoi fare","What you can do"],b:["Correggi i campi e premi Salva modifiche: valgono per le prossime spese automatiche. La ✕ ferma la ricorrente senza cancellare le spese già inserite. Una ricorrente creata con una data passata viene inserita per tutti i mesi dalla data scelta fino a oggi.","Edit the fields and tap Save changes: they apply to the next automatic entries. ✕ stops the recurring expense without deleting the ones already added. A recurring expense created with a past date is added for every month from that date up to today."]}]},
 pick:{t:["Scelta dell'anno","Choosing the year"],s:[
  {h:["Come funziona","How it works"],b:["Ogni anno ha i suoi dati. Tocca un anno per aprirlo: l'app lo ricorda e alle prossime aperture va diretta lì. Il 1° gennaio l'anno nuovo nasce da solo, con le voci dell'anno prima e il valore di dicembre come partenza.","Each year has its own data. Tap a year to open it: the app remembers it and opens there next time. On 1 January the new year is created automatically, with last year's items and December's value as the starting point."]},
  {h:["Da sapere","Good to know"],b:["Per tornare qui usa Cambia anno in Impostazioni. Con + Aggiungi anno puoi creare anche anni passati.","To come back here use Change year in Settings. With + Add year you can also create past years."]}]}
};
const HELP_ORDER=["home","cat","catfin","upd","fin","reb","tax","sim","hist","exp","rec","trend","graph","inc","igraph","sav","goals","hof","pick","acct","set","valid","setup"];
const T=a=>L(a[0],a[1]);
const BULB='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-4.1 10.4c.7.6 1.1 1.4 1.1 2.6h6c0-1.2.4-2 1.1-2.6A6 6 0 0 0 12 3z"/></svg>';
const helpKey=()=>S.scr==="cat"?(TKCAT.includes(S.cat)?"catfin":"cat"):(HELP[S.scr]?S.scr:"home");
const helpHtml=k=>{const H=HELP[k];return H.s.map(x=>`<h3>${T(x.h)}</h3><p>${T(x.b)}</p>`).join("");};
function openHelp(k){
  const H=HELP[k]||HELP.home,d=document.createElement("div");d.className="ov help";
  d.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><b style="font-size:1.1rem">${T(H.t)}</b><button class="ghost" data-x="close" style="padding:4px 10px">✕</button></div>${helpHtml(k)}
  <p style="margin:14px 0 0"><button class="ghost" data-x="guide" style="width:100%">${L("Apri la guida completa","Open the full guide")}</button></p></div>`;
  document.querySelector("main").appendChild(d);
  d.addEventListener("click",e=>{const x=e.target.closest("[data-x]");if(x&&x.dataset.x==="guide"){d.remove();renderGuide();screen("guide");}else if(x||e.target===d)d.remove();});
}
function renderGuide(){
  let h=`<div class="hd"><div class="top"><button class="ghost" data-a="set">‹ Impostazioni</button></div><h1 style="font-size:1.5rem;margin:14px 0 0">${ic("set")}${L("Guida","Guide")}</h1></div>
  <p class="mini">${L("Tutto quello che l'app sa fare, pagina per pagina. In ogni pagina trovi la stessa spiegazione toccando la lampadina in alto.","Everything the app does, page by page. On every page you find the same explanation by tapping the bulb at the top.")}</p>
  <p><button class="ghost" data-a="welcome" style="width:100%">${L("Rivedi il benvenuto","See the welcome again")}</button></p>`;
  h+=HELP_ORDER.map(k=>{const H=HELP[k],open=S.gopen===k;return `<button class="catbtn" data-a="gopen" data-k="${k}" aria-expanded="${open}" style="width:100%"><span>${T(H.t)}</span><span class="r">${open?"▴":"▾"}</span></button>${open?`<div class="card help" style="margin:-6px 0 10px">${helpHtml(k)}</div>`:""}`;}).join("");
  $("guide").innerHTML=h;
}
// benvenuto al primo accesso: tre passi, poi non compare più
const WELCOME=[
 {t:["Benvenuto in Mozzi","Welcome to Mozzi"],b:["Qui tieni traccia di quanto possiedi, di quanto spendi e di quanto risparmi, senza fogli di calcolo. Tutto parte dalla home: il patrimonio netto del mese e le cinque categorie (azioni, obbligazioni, altri investimenti, liquidità, beni di valore).","Here you track what you own, what you spend and what you save, without spreadsheets. Everything starts from the home: the month's net worth and the five categories (stocks, bonds, other investments, cash, valuables)."]},
 {t:["1. Aggiungi le tue voci","1. Add your items"],b:["Tocca una categoria e usa + Aggiungi voce: un conto, un titolo con il numero di quote, un oggetto di valore. Dal Menu ▾ in alto raggiungi Spese, Entrate, Risparmio e tutto il resto. In modalità demo trovi dati inventati per provare.","Tap a category and use + Add item: an account, a security with its units, a valuable. From the Menu ▾ at the top you reach Expenses, Income, Savings and everything else. In demo mode you find invented data to try things out."]},
 {t:["2. Ogni mese, due minuti","2. Two minutes every month"],b:["Ogni mese finito si chiude da solo. Apri Aggiorna mese (in fondo alla home) quando vuoi aggiornare i saldi; nei mesi chiusi puoi correggere e salvare. L'app ti avvisa e ti offre il backup.","Every finished month closes by itself. Open Update month (at the bottom of the home) when you want to update balances; in closed months you can correct and save. The app notifies you and offers a backup."]},
 {t:["3. Se non sai cosa fa qualcosa","3. If you don't know what something does"],b:["In ogni pagina c'è una lampadina in alto: spiega quello che vedi e cosa puoi fare. In Impostazioni trovi la guida completa. Premendo Inizia parte la configurazione guidata, che ti dice dove mettere ogni cosa.","Every page has a bulb at the top: it explains what you see and what you can do. In Settings you find the full guide. Tapping Start opens the guided setup, which tells you where to put everything."]}];
function showWelcome(force){
  if(!force&&LS.get("welcome:"+uid,0))return;let i=0;const d=document.createElement("div");d.className="ov help";
  const paint=()=>{const W=WELCOME[i],last=i===WELCOME.length-1;d.innerHTML=`<div class="card"><div class="mini">${WELCOME.map((x,k)=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:${k===i?"var(--acc)":"var(--line)"}"></span>`).join("")}</div>
    <h2 style="margin:10px 0 6px;font-size:1.2rem">${T(W.t)}</h2><p style="margin:0 0 14px">${T(W.b)}</p>
    <div class="row">${i>0?`<button class="ghost" data-x="prev">${L("Indietro","Back")}</button>`:`<button class="ghost" data-x="skip">${L("Salta","Skip")}</button>`}<button class="go" data-x="next">${last?L("Inizia","Start"):L("Avanti","Next")}</button></div>
    ${last?`<p style="margin:10px 0 0"><button class="ghost" data-x="imp" style="width:100%">${L("Ho già un file esportato: importa","I already have an export: import")}</button></p>`:""}</div>`;};
  d.addEventListener("click",e=>{const x=e.target.closest("[data-x]");if(!x)return;const a=x.dataset.x;
    if(a==="imp"){LS.set("welcome:"+uid,1);LS.set("setuphide:"+uid,1);d.remove();renderAcct();screen("acct");return;}
    if(a==="prev")i--;else if(a==="skip"||(a==="next"&&i===WELCOME.length-1)){LS.set("welcome:"+uid,1);d.remove();if(a==="next"){renderSetup();screen("setup");}return;}else i++;paint();});
  paint();document.querySelector("main").appendChild(d);
}

const draw=()=>({cat:renderCat,upd:renderUpd,fin:renderFin,reb:renderReb,tax:renderTax,set:renderSet,hist:renderHist,exp:renderExp,trend:renderTrend,inc:renderInc,sav:renderSav,goals:renderGoals,hof:renderHof,valid:renderValid,graph:renderGraph,igraph:renderIGraph,sim:renderSim,guide:renderGuide,setup:renderSetup,acct:renderAcct,rec:renderRec}[S.scr]||renderHome)();
document.addEventListener("change",e=>{const t=e.target,R=S.data.reb;
  if(t.id==="et")syncForm();
  if(t.dataset.r){R[rk(R)][t.dataset.r]=t.value.trim();save();}
  if(t.id==="racq"){R.acq=t.value.trim();save();}
  if(t.id==="rtol"){R.tol=t.value.trim();save();}
  if(t.id==="imp"){importFile(t.files[0]);t.value="";}
  if(t.id==="ec2"){const dl=$("subs");if(dl)dl.innerHTML=subsOf(t.value).map(x=>`<option value="${esc(x)}">`).join("");}
  if(t.id==="cmpc"){S.cmpC=t.value;renderTrend();}
  if(t.id==="nwc"){const d=$("nws");if(d)d.setAttribute("list","subs-"+t.value);}
  if(t.dataset.np){const P=NP();P[t.dataset.np]=t.type==="checkbox"?t.checked:Number(t.value);LS.set("notif:"+uid,P);
    if(LS.get("notifon:"+uid,0)&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription()).then(sb=>{if(sb)pushSave(sb);}).catch(()=>{});}
  if(t.dataset.rc){const d=document.querySelector(`#rec [data-rs="${t.dataset.rc}"]`);if(d)d.setAttribute("list","subs-"+t.value);}
  if(t.id==="xm"){S.xm=Number(t.value);renderExp();}
  if(t.id==="firer"){const x=parseNum(t.value);if(x>0)LS.set("fire:"+uid,x);renderSav();}
  if(t.id==="ngv"){const x=parseNum(t.value);S.data.ngoal={...(S.data.ngoal||{mode:"pct"}),v:x!==null&&isFinite(x)&&x>0?x:""};save();renderGoals();}
  if(t.dataset.sim){SIM[t.dataset.sim]=t.type==="checkbox"?t.checked:t.value.trim();simSave();renderSim();}
  if(t.dataset.al){const [i,f]=t.dataset.al.split(":").map(Number);if(SIM.alloc[i])SIM.alloc[i][f]=f===0?t.value:t.value.trim();simSave();renderSim();}
  if(t.id==="simpre"){const pr=SIM_PRESETS.find(x=>x[0]===t.value);if(pr){SIM.alloc=JSON.parse(JSON.stringify(pr[2]));simSave();renderSim();}}
  if(t.dataset.b!==undefined){const B=S.data.budget=S.data.budget||{},x=parseNum(t.value);if(x===null||!(x>=0))delete B[t.dataset.b];else B[t.dataset.b]=x;save();renderGoals();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="tkq"){e.preventDefault();tkSearch();}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.r||t.id==="racq"||t.id==="rtol")updateReb();
  if(t.id==="ew"){S.eword=t.value;const k=CFG.dict[t.value.trim().toLowerCase()];if(k)setECat(k[0],k[1]);}
  if(t.id==="xq"){S.xq=t.value;clearTimeout(S.xt);S.xt=setTimeout(()=>{renderExp();const q=$("xq");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}},350);}
  if(t.id==="vq"){S.vq=t.value;clearTimeout(S.vt);S.vt=setTimeout(()=>{renderValid();const q=$("vq");q.focus();q.setSelectionRange(q.value.length,q.value.length);},350);}});
document.addEventListener("click",e=>{
  if(S.menu&&!e.target.closest("#bar")){S.menu=false;renderMenu();}
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="menu"){S.menu=!S.menu;S.sub=false;S.esub=false;S.isub=false;renderMenu();return;}
  if(a==="esub"){S.esub=!S.esub;renderMenu();return;}
  if(a==="isub"){S.isub=!S.isub;renderMenu();return;}
  if(a==="sub"){S.sub=!S.sub;renderMenu();return;}
  if(S.menu){S.menu=false;renderMenu();}
  if(!["del","edel","idel"].includes(a))S.delAsk=false;
  if(a==="years")showPicker();
  else if(a==="out")out();
  else if(a==="mm"){S.m=Math.min(12,Math.max(1,S.m+Number(b.dataset.d)));S.edit=null;draw();}
  else if(a==="cur"){S.base=b.dataset.c;LS.set("base",S.base);draw();}
  else if(a==="cat"){S.cat=b.dataset.c;S.edit=null;renderCat();screen("cat");}
  else if(a==="home"){renderHome();screen("home");}
  else if(a==="add"){S.edit="new";renderCat();}
  else if(a==="edit"){S.edit=b.dataset.id;renderCat();}
  else if(a==="cancel"){S.edit=null;renderCat();}
  else if(a==="px")refresh(false);
  else if(a==="upd"){S.edit=null;renderUpd();screen("upd");}
  else if(a==="close"){const y=Number(b.dataset.y),m=Number(b.dataset.m),go=()=>{S.m=m;S.edit=null;renderUpd();screen("upd");};if(y!==S.y)openYear(y).then(go);else go();}
  else if(a==="ack"){LS.set("ack:"+uid+":"+b.dataset.y+"-"+b.dataset.m,1);renderHome();}
  else if(a==="saveall")saveAll();
  else if(a==="set"){renderSet();screen("set");}
  else if(a==="hist"){renderHist();screen("hist");}
  else if(a==="exp"){S.eedit=null;S.eword=undefined;S.eall=false;S.xq="";S.xm=0;renderExp();screen("exp");}
  else if(a==="trend"){renderTrend();screen("trend");}
  else if(a==="inc"){S.iedit=null;renderInc();screen("inc");}
  else if(a==="sav"){renderSav();screen("sav");}
  else if(a==="goals"){renderGoals();screen("goals");}
  else if(a==="hof"){renderHof();screen("hof");}
  else if(a==="valid"){S.vq="";renderValid();screen("valid");}
  else if(a==="esave")saveExp();
  else if(a==="ecat")setECat(b.dataset.c);
  else if(a==="eedit"){S.eedit=b.dataset.id;S.eword=undefined;renderExp();scrollTo(0,0);}
  else if(a==="ecancel"){S.eedit=null;S.eword=undefined;renderExp();}
  else if(a==="edel"){if(!S.delAsk){S.delAsk=true;renderExp();}else{const e=EXP().find(x=>x.id===S.eedit);if(e&&e.r)(S.data.recSkip=S.data.recSkip||[]).push(e.r+":"+mOf(e.d));S.data.exp=EXP().filter(x=>x.id!==S.eedit);S.eedit=null;S.eword=undefined;S.delAsk=false;save();renderExp();}}
  else if(a==="eall"){S.eall=true;renderExp();}
  else if(a==="rdel"){CFG.rec=CFG.rec.filter(r=>r.id!==b.dataset.id);cfgSave();if(S.scr==="rec")renderRec();else renderExp();}
  else if(a==="rec"){renderRec();screen("rec");}
  else if(a==="rsave")saveRec();
  else if(a==="cmp"){S.cmp=!S.cmp;if(!S.cmpM||!S.cmpM.length)S.cmpM=[S.m];renderTrend();}
  else if(a==="cm"){const m=Number(b.dataset.m);S.cmpM=S.cmpM||[];if(S.cmpM.includes(m)){if(S.cmpM.length>1)S.cmpM=S.cmpM.filter(x=>x!==m);}else S.cmpM.push(m);S.cmpM.sort((x,y)=>x-y);renderTrend();}

  else if(a==="ngm"){S.data.ngoal={...(S.data.ngoal||{v:""}),mode:b.dataset.m};save();renderGoals();}
  else if(a==="gdel"){const g=S.data.goals.find(x=>x.id===b.dataset.id);sure(L("Eliminare l'obiettivo \"","Delete the goal \"")+g.name+"\"?",()=>{S.data.goals=S.data.goals.filter(x=>x.id!==g.id);save();renderGoals();});}
  else if(a==="wdel"){delete CFG.dict[b.dataset.w];CFG.setupValid=true;cfgSave();renderValid();}
  else if(a==="wadd"){const w=$("nw").value.trim().toLowerCase(),c=$("nwc").value,sub=$("nws").value.trim()||subsOf(c)[0]||"Varie",m=$("nwmsg");
    if(!w){if(m)m.textContent=L("Scrivi la parola.","Write the word.");return;}const was=!!CFG.dict[w];CFG.dict[w]=[c,sub];CFG.setupValid=true;cfgSave();S.vq="";renderValid();
    const m2=$("nwmsg");if(m2){m2.style.color="var(--ok)";m2.textContent=(was?L("Parola aggiornata: ","Word updated: "):L("Parola aggiunta: ","Word added: "))+w+" → "+ECN(c)+" / "+sub;}}
  else if(a==="wdefdel")sure(L("Eliminare le parole di esempio? Le tue restano.","Delete the sample words? Yours stay."),()=>{Object.keys(CFG.dict).forEach(w=>{if(DEF_DICT[w])delete CFG.dict[w];});CFG.setupValid=true;cfgSave();renderValid();});
  else if(a==="vsave")saveValid();
  else if(a==="icadd"){const n=$("icn").value.trim();if(n&&!CFG.inc.includes(n)){CFG.inc.push(n);cfgSave();renderValid();}}
  else if(a==="icdel"){CFG.inc.splice(Number(b.dataset.i),1);if(!CFG.inc.length)CFG.inc=["Stipendio"];cfgSave();renderValid();}
  else if(a==="cadd"){const n=$("cnn").value.trim();if(n){addCat(n);renderValid();}}
  else if(a==="cdel"){const id=b.dataset.c;sure(L("Eliminare la categoria \"","Delete the category \"")+ECN(id)+L("\"? Parole e spese passano in Altro.","\"? Words and expenses move to Altro."),()=>{delCat(id);renderValid();});}
  else if(a==="graph"){renderGraph();screen("graph");}
  else if(a==="xgcat"){S.gHide=S.gHide||[];const c=b.dataset.c;S.gHide=S.gHide.includes(c)?S.gHide.filter(x=>x!==c):[...S.gHide,c];renderGraph();}
  else if(a==="xgbar"){S.gm=Number(b.dataset.m);renderGraph();}
  else if(a==="igraph"){renderIGraph();screen("igraph");}
  else if(a==="xigcat"){S.igHide=S.igHide||[];const c=b.dataset.c;S.igHide=S.igHide.includes(c)?S.igHide.filter(x=>x!==c):[...S.igHide,c];renderIGraph();}
  else if(a==="xigbar"){S.igm=Number(b.dataset.m);renderIGraph();}
  else if(a==="sim"){simLoad();renderSim();screen("sim");}
  else if(a==="saladd"){SIM.alloc.push([L("Nuova classe","New class"),0,5,10]);simSave();renderSim();}
  else if(a==="saldel"){if(SIM.alloc.length>1)SIM.alloc.splice(Number(b.dataset.i),1);simSave();renderSim();}
  else if(a==="simmine"){simMine();}
  else if(a==="tksearch")tkSearch();
  else if(a==="tkpick")tkPick(b);
  else if(a==="wipe")sure(L("Cancellare tutti i dati di prova? Non torneranno.","Delete all demo data? They won't come back."),wipeDemo);
  else if(a==="ics")makeIcs(false);
  else if(a==="notifon")notifOn();
  else if(a==="notifoff")notifOff();
  else if(a==="icsd")makeIcs(true);
  else if(a==="help")openHelp(helpKey());
  else if(a==="oauth"){if(D)return;localStorage.setItem(KEEP,$("keep").checked?"1":"0");say(L("Ti porto all'accesso…","Taking you to sign in…"));
    db.auth.signInWithOAuth({provider:b.dataset.p,options:{redirectTo:location.origin+location.pathname}}).then(({error})=>{if(error)say(error.message,"err");});}
  else if(a==="fb"){if(!FEEDBACK_EMAIL.includes("@"))return sure(L("Indirizzo per il feedback non ancora impostato nel codice (FEEDBACK_EMAIL).","Feedback address not set in the code yet (FEEDBACK_EMAIL)."),()=>{});
    const here=({cat:S.cat||""})[S.scr]||S.scr,body=L("Feedback su Mozzi","Feedback on Mozzi")+" ("+APP_VERSION+")\n"+L("Pagina","Page")+": "+here+"\n"+L("Lingua","Language")+": "+LANG+"\n"+L("Dispositivo","Device")+": "+navigator.userAgent+"\n\n"+L("Cosa non va o cosa vorrei:","What's wrong or what I'd like:")+"\n";
    location.href="mailto:"+FEEDBACK_EMAIL+"?subject="+encodeURIComponent("Feedback Mozzi "+APP_VERSION)+"&body="+encodeURIComponent(body);}
  else if(a==="helppick")openHelp("pick");
  else if(a==="guide"){renderGuide();screen("guide");}
  else if(a==="setup"){renderSetup();screen("setup");}
  else if(a==="acct"){renderAcct();screen("acct");}
  else if(a==="legal")openLegal();
  else if(a==="demo"){try{localStorage.setItem("forcedemo","1");}catch{}location.reload();}
  else if(a==="undemo"){try{localStorage.setItem("forcedemo","0");}catch{}location.reload();}
  else if(a==="setupall"){LS.set("setupskip:"+uid,SETUP.map(x=>x.id));LS.set("setuphide:"+uid,1);renderHome();screen("home");}
  else if(a==="pwd")ask(L("Nuova password (almeno 6 caratteri)","New password (at least 6 characters)"),"••••••",async v=>{if(v.length<6)return;const {error}=await db.auth.updateUser({password:v});const m=smsgEl();if(m)m.textContent=error?error.message:L("Password aggiornata.","Password updated.");});
  else if(a==="setupskip"){LS.set("setupskip:"+uid,[...setupSkip(),b.dataset.id]);renderSetup();}
  else if(a==="setuphide"){LS.set("setuphide:"+uid,1);renderHome();}
  else if(a==="gopen"){S.gopen=S.gopen===b.dataset.k?null:b.dataset.k;renderGuide();}
  else if(a==="welcome"){showWelcome(true);}
  else if(a==="lang"){LS.set("lang",b.dataset.l);location.reload();}
  else if(a==="export")exportAll();
  else if(a==="fin"){renderFin();screen("fin");}
  else if(a==="reb"||a==="tax"){renderTax();screen("tax");}
  else if(a==="taxok"||a==="taxno"){
    const R=S.data.reb=S.data.reb||{mode:"pct",pct:{},amt:{}},X=R.tax=R.tax||{rate:"",gain:{}};
    X.on=a==="taxok";
    if(X.on){X.rate=$("trate").value.trim();X.cur=S.base;document.querySelectorAll("[data-g]").forEach(e=>{X.gain[e.dataset.g]=e.value.trim();});}
    save();renderReb();screen("reb");}
  else if(a==="rmode"){const R=S.data.reb;R.mode=b.dataset.m;save();renderReb();}
  else if(a==="fxset")ask("Cambio EUR/USD di "+MESI[S.m-1].toLowerCase(),"es. 1,153",v=>{const x=Number(v.replace(",","."));if(x>0){(S.data.fx=S.data.fx||{})[S.m]=x;save();draw();}});
  else if(a==="save")saveItem();
  else if(a==="del"){if(!S.delAsk){S.delAsk=true;renderCat();}else{S.delAsk=false;S.data.items=S.data.items.filter(i=>i.id!==S.edit);S.edit=null;save();renderCat();}}
});
