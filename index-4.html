<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Mozzi">
<title>Mozzi</title>
<style>
/* ============================================================
   Mozzi · foglio di stile
   Foglio di stile completo dell'app (unico blocco di stile del file).
   Nero, un solo accento, righe sottili, testi fini.
   Non richiede modifiche a HTML o JavaScript.
   ============================================================ */

/* ---------- token ---------- */
:root{
  --bg:#000;--card:#0f1312;--ink:#f2f6f5;--mut:#8d9a97;--line:#222927;
  --acc:#4fc3b8;--accink:#06201e;--err:#ff6b60;--ok:#3ddc8a;--c2:#f5a524;
  --acc-soft:color-mix(in srgb,var(--acc) 12%,transparent);
  --ink-soft:color-mix(in srgb,var(--ink) 8%,transparent);
  --font:-apple-system,BlinkMacSystemFont,system-ui,"Helvetica Neue",Arial,sans-serif;
  --r-m:14px;--r-l:22px;--r-pill:999px;
  --tap:44px;
  --t-fast:120ms;--t-base:180ms;--t-sheet:220ms;--ease:cubic-bezier(.2,.7,.2,1);
}

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:300 16px/1.5 var(--font);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
main{max-width:420px;margin:0 auto;padding:16px 0 64px}
button{font:inherit;color:inherit;touch-action:manipulation}
h1,h2{font-family:var(--font);font-weight:400;letter-spacing:-.01em;margin:0}
h1{font-size:2rem;line-height:1.15;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 24px}
b,strong{font-weight:500}
.mini{font-size:.875rem;line-height:1.45;color:var(--mut);font-weight:300;overflow-wrap:anywhere}
.mini b{color:var(--ink);font-weight:400}
.up,.mini .up{color:var(--ok)}
.dn,.mini .dn{color:var(--err)}
.who{font-weight:400;word-break:break-all}
.net{display:inline-block;font-size:.8125rem;color:var(--mut);margin-top:18px}
[hidden]{display:none!important}
body.lock{overflow:hidden}

/* ---------- focus ---------- */
:focus{outline:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
input:focus-visible,select:focus-visible{outline:0}

/* ---------- campi ---------- */
label{display:block;font-size:.8125rem;color:var(--mut);font-weight:400;margin:0 0 2px}
input,select{display:block;width:100%;min-height:var(--tap);font:inherit;font-weight:400;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0 12px;margin:0 0 16px;-webkit-appearance:none;appearance:none;transition:border-color var(--t-base),box-shadow var(--t-base)}
input::placeholder{color:var(--mut);opacity:.6}
input:focus,select:focus{border-bottom-color:var(--acc);box-shadow:0 1px 0 var(--acc)}
input:disabled,select:disabled{opacity:.45}
select{padding-right:26px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238d9a97' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 2px center;background-size:16px}
select option{background:var(--card);color:var(--ink)}
input[type=date]{text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=checkbox]{display:inline-block;width:20px;height:20px;min-height:0;margin:0;padding:0;border:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--acc);flex:none}
input[type=color]{width:40px;height:40px;min-height:0;padding:0;margin:0;border:1px solid var(--line);border-radius:50%;flex:none;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.chk{display:flex;align-items:center;gap:12px;margin:4px 0 16px;font-size:.9375rem;font-weight:300;color:var(--ink);min-height:var(--tap)}
.chk input{width:20px;margin:0}
.row{display:flex;gap:10px;align-items:stretch}
.row>div{min-width:0}
.row input,.row select{margin:0}
.row .go,.row .ghost{width:auto}

/* ---------- pulsanti ---------- */
.go,.ghost{display:inline-block;width:100%;min-height:var(--tap);padding:12px 18px;border-radius:var(--r-pill);border:1px solid var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:500;line-height:1.25;text-align:center;cursor:pointer;transition:background-color var(--t-base) var(--ease),border-color var(--t-base),color var(--t-base),opacity var(--t-fast),transform var(--t-fast)}
.ghost{width:auto;border-color:var(--line);color:var(--ink);font-weight:400}
.go:active{background:var(--acc-soft);transform:scale(.98)}
.ghost:active{background:var(--ink-soft);transform:scale(.98)}
.go:disabled,.ghost:disabled{opacity:.4;pointer-events:none}
.gtbl .ghost,.hrow .ghost,.mini .ghost{min-height:32px;padding:4px 10px;font-size:.875rem}
.lnk{background:none;border:0;color:var(--acc);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.flag{font-size:1.5rem;line-height:1}
.go.flag,.ghost.flag{min-width:var(--tap);padding:6px 10px}

/* ---------- barra in alto e intestazioni ---------- */
.logo{display:flex;justify-content:center;margin:4px 0 12px}
.logo svg{width:40px;height:40px;display:block}
#bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;margin:0 -16px 6px;padding:4px 16px;background:var(--bg)}
#bar>.mini{position:absolute;left:50%;transform:translateX(-50%);max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.875rem;color:var(--mut)}
.mbtn{border:0;background:none;padding:10px 0;min-height:var(--tap);font-weight:500;color:var(--ink);cursor:pointer;transition:color var(--t-base),opacity var(--t-fast)}
.mbtn:active{opacity:.6}
.bulb{flex:none;width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;border:0;border-radius:var(--r-pill);background:none;color:var(--mut);padding:0;cursor:pointer;transition:color var(--t-base),transform var(--t-fast)}
.bulb:active{color:var(--acc);transform:scale(.94)}
.ico{width:22px;height:22px;display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:var(--tap);margin:0 0 4px}
.top .ghost{border:0;padding:10px 0;color:var(--mut);font-weight:400;background:none;min-width:0}
.top .ghost:active{color:var(--ink);transform:none;background:none}
.top .yr,.top .mini{font-size:.9375rem;color:var(--mut);font-weight:400}
.mb{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.mb button{width:var(--tap);height:var(--tap);border:0;background:none;color:var(--ink);border-radius:var(--r-pill);font-size:1.5rem;line-height:1;cursor:pointer;transition:opacity var(--t-fast),transform var(--t-fast)}
.mb button:active{transform:scale(.9)}
.mb button:disabled{opacity:.25}
.mb span{font-weight:400}
.gt{font-size:.9375rem;font-weight:400;color:var(--mut);margin:28px 0 6px;letter-spacing:0;border:0;padding:0}
/* ogni sezione ha il suo colore: verde acqua per il patrimonio, ambra per le spese, verde per le entrate, azzurro per il risparmio, rosa per gli obiettivi, oro per la hall of fame */
body[data-sec="spese"]{--acc:#f5a524;--accink:#1a1200}body[data-sec="entrate"]{--acc:#3ddc8a;--accink:#06201e}body[data-sec="risparmio"]{--acc:#5b8def;--accink:#0a1530}
body[data-sec="obiettivi"]{--acc:#ec6aa6;--accink:#2a0716}body[data-sec="hof"]{--acc:#e0b45a;--accink:#1a1200}body[data-sec="sistema"]{--acc:#9bb0ab;--accink:#0a0d0c}
/* i pallini colorati del menu sono stati sostituiti dalle icone: vedi in fondo */
h1+p.mini,.gt+p.mini{display:none}   /* le spiegazioni lunghe vivono nella lampadina */
.pxs{text-align:center;margin:10px 0}

/* ---------- numeri grandi e variazioni ---------- */
.big{font-size:2.6rem;line-height:1.1;font-weight:300;letter-spacing:-.03em;margin:4px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:.8125rem;font-weight:500;font-style:normal;line-height:1.3;padding:0;margin-left:8px;vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.up{color:var(--ok)}
.pill.dn{color:var(--err)}
.pill.fl{color:var(--mut)}
.big .pill{font-size:1rem;margin-left:10px;letter-spacing:0}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.r .pill{margin:0}
.chg{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:4px}
.chg .pill,.fx .pill{margin:0}
.chg .pill+small{margin-left:-6px}
.chg small,.fx small{color:var(--mut);font-size:.8125rem;font-weight:300}
.fx{margin:10px 0 0;padding:4px 0;cursor:pointer}

/* ---------- sezioni e riquadri ---------- */
.card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:20px 0}
.card.ug{padding:0}
.card.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 18px 16px;margin:8px 0 18px}
.card.note b{display:block;font-size:1rem;font-weight:500;margin-bottom:2px}
.card.note .row{margin-top:6px}
.warn{border:1px solid var(--err);color:var(--err);border-radius:var(--r-m);padding:12px 14px;margin-bottom:16px;font-size:.875rem}
#msg{min-height:1.4em;margin:14px 0 0;font-size:.875rem;color:var(--mut)}
#msg.err{color:var(--err)}
#msg.ok{color:var(--ok)}

/* ---------- liste e righe ---------- */
.cats,.list{display:grid;gap:0;margin:4px 0 20px}
.catbtn,.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:60px;padding:16px 0;text-align:left;font:inherit;font-weight:300;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer;transition:opacity var(--t-fast)}
.catbtn:active,.item:active{opacity:.55}
.catbtn b,.item b{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.item{align-items:flex-start}
.item small{display:block;color:var(--mut);font-size:.8125rem;font-weight:300;margin-top:2px}
.hrow,.urow,.rrow{font-weight:300}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;min-height:var(--tap);font-variant-numeric:tabular-nums}
.hrow+.hrow{border-top:1px solid var(--line)}
.hrow b{font-weight:400}
.hrow .pill{margin-left:8px}
.urow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;margin:0;font-size:1rem;color:var(--ink)}
.urow+.urow{border-top:1px solid var(--line)}
.urow input{width:42%;margin:0;text-align:right;padding:8px 0;border-bottom-color:transparent}
.urow small{display:block;color:var(--mut);font-size:.8125rem;font-weight:300}
.urow b{font-weight:400}
.rrow{padding:14px 0}
.rrow+.rrow{border-top:1px solid var(--line)}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.rh b{font-weight:400;font-variant-numeric:tabular-nums}
.res{flex:1;text-align:right;align-self:center;font-weight:500}
.res.s{color:var(--err)}
.res.b{color:var(--ok)}
.res.m{color:var(--mut);font-weight:300}
.res small{display:block;font-weight:300;color:var(--mut);font-size:.8125rem}
.arow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto;gap:6px;align-items:center;padding:6px 0}
.arow+.arow{border-top:1px solid var(--line)}
.arow input{margin:0;padding:8px 0;min-width:0;min-height:40px}
.arow input:not(:first-child){text-align:right}
.arow.ah span{font-size:.75rem;color:var(--mut)}
.vrow{display:grid;grid-template-columns:1.1fr 1fr 1.1fr auto;gap:8px;align-items:center;padding:8px 0}
.vrow+.vrow{border-top:1px solid var(--line)}
.vrow input,.vrow select{margin:0;padding:8px 0;min-width:0;min-height:40px}
.vrow small{grid-column:1/-1;color:var(--mut);font-size:.8125rem}
.bar{height:4px;background:var(--line);border-radius:var(--r-pill);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:var(--r-pill)}

/* ---------- selezioni: chip, EUR/USD, schede ---------- */
.cur{display:flex;gap:8px;margin-top:16px}
.cur button,.chip{position:relative;border:1px solid var(--line);background:none;color:var(--mut);border-radius:var(--r-pill);padding:7px 14px;min-height:34px;font:inherit;font-size:.8125rem;font-weight:400;cursor:pointer;transition:color var(--t-base),border-color var(--t-base),background-color var(--t-base),transform var(--t-fast)}
.cur button::after,.chip::after{content:"";position:absolute;inset:-5px}   /* area di tocco da 44 px */
.cur button[aria-pressed=true],.chip[aria-pressed=true]{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}
.cur button:active,.chip:active{transform:scale(.96)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{font-size:.875rem;padding:8px 14px;min-height:36px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:400;padding:12px 8px;min-height:var(--tap);cursor:pointer;box-shadow:inset 0 -2px 0 transparent;transition:color var(--t-base),box-shadow var(--t-base)}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--acc)}

/* ---------- tabelle ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.8125rem;font-weight:300;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:10px 3px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--mut);font-weight:400;border-top:0;padding-top:4px}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal;padding-left:0;position:sticky;left:0;background:var(--bg);padding-right:8px}   /* la prima colonna resta ferma quando la tabella scorre */
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl b{font-weight:500}
.gtbl{border-collapse:collapse;width:100%}
.gtbl th{font-weight:400;color:var(--mut);font-size:.75rem;padding:6px 1px}
.gtbl td{padding:4px 1px;text-align:center}
.gtbl td:first-child{text-align:left;font-size:.8125rem;line-height:1.25;font-weight:300;padding:4px 8px 4px 0;max-width:86px;overflow-wrap:anywhere}
.gb{display:block;margin:0 auto;width:18px;height:18px;border-radius:5px;border:1px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:background-color var(--t-base),border-color var(--t-base),transform var(--t-fast)}
.gb:active{transform:scale(.9)}
.gb.g{background:var(--ok);border-color:var(--ok)}
.gb.y{background:var(--c2);border-color:var(--c2)}
.gb.r{background:var(--err);border-color:var(--err)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;vertical-align:-1px}
.lg{transition:opacity var(--t-base)}
.lg.off{opacity:.4}
.lg.off .dot{background:var(--line)!important}

/* ---------- grafici ---------- */
.chart{display:block;width:100%;height:auto;margin:8px 0 10px}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln1,.c1{stroke:var(--acc);color:var(--acc)}
.ln2,.c2{stroke:var(--c2);color:var(--c2)}
.ln1d{fill:var(--acc)}
.ln2d{fill:var(--c2)}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mut);font:400 10px var(--font)}
.ax[font-weight]{fill:var(--ink);font-weight:500}
.spark{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;margin-top:10px;cursor:pointer}
.spark svg{display:block;width:100%;height:56px;margin-top:8px}

/* ---------- scelta dell'anno ---------- */
.pick h2{font-size:1.5rem;line-height:1.2;text-align:center;margin:8px 0 24px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{aspect-ratio:1;border:0;border-radius:18px;color:#fff;font:400 2rem/1 var(--font);letter-spacing:-.02em;display:flex;align-items:flex-end;padding:16px;text-align:left;cursor:pointer;transition:transform var(--t-fast),filter var(--t-base)}
.tile:active{transform:scale(.97)}
.t0{background:#0f6b6b}.t1{background:#1d5c96}.t2{background:#b26a16}.t3{background:#6e3b7a}
.tile.add{background:none;border:1px dashed var(--line);color:var(--mut);font:400 1rem/1.3 var(--font);align-items:center;justify-content:center;text-align:center}
.addform{margin-top:18px}

/* ---------- menu a schermo intero ---------- */
.panel{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top,0px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.panel .wrap{max-width:420px;margin:0 auto;animation:in var(--t-base) var(--ease)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:4px 0;margin-bottom:10px}
.ph .mini{font-size:.875rem}
.mi{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:58px;padding:16px 0;text-align:left;font:inherit;font-size:1.125rem;font-weight:300;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer;transition:opacity var(--t-fast),color var(--t-base)}
.mi:active{opacity:.55}
.mi>span:last-child{color:var(--mut);font-weight:300;font-size:1rem}
.mi[aria-expanded=true]{font-weight:400}
.mi.sm{font-size:1rem;min-height:50px;padding:13px 0 13px 18px;box-shadow:inset 1px 0 0 var(--line)}
.mi.sm>span:last-child{font-size:.875rem}
.mi.on{color:var(--acc);font-weight:500}

/* ---------- fogli: lampadina, benvenuto, finestre ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .15s ease-out}
.ov .card{width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-l) var(--r-l) 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:sheet var(--t-sheet) var(--ease)}
.ov.help .card{max-width:480px}
.ov:has(input):not(.help){align-items:center;padding:16px}          /* con la tastiera aperta la finestra resta visibile */
.ov:has(input):not(.help) .card{border-bottom:1px solid var(--line);border-radius:var(--r-l);padding-bottom:20px}
.ov .row .go{flex:1}
.help h3{margin:18px 0 4px;font-size:1rem;font-weight:500}
.help p{margin:0 0 6px;line-height:1.5;font-weight:300}

/* ---------- movimento: breve, solo in risposta a un'azione ---------- */
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
main>section:not([hidden]){animation:in var(--t-base) var(--ease)}
@media (hover:hover){
  .go:hover{background:var(--acc-soft)}
  .ghost:hover{border-color:var(--mut)}
  .top .ghost:hover,.mbtn:hover,.bulb:hover{color:var(--acc);border-color:transparent}
  .catbtn:hover,.item:hover,.mi:hover{opacity:.75}
  .chip:hover,.cur button:hover{border-color:var(--mut);color:var(--ink)}
  .tile:hover{filter:brightness(1.08)}
  .lnk:hover{color:var(--ink)}
}
.gbar{position:relative;margin:10px 0 24px}.gbar .bar{height:6px}.gbar .mark{position:absolute;left:80%;top:-5px;height:16px;width:1px;background:var(--mut)}.gbar .mark::after{content:"100%";position:absolute;top:16px;left:-14px;font-size:.7rem;color:var(--mut);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- icone nel menu e più colore di sezione (5 ott 2026) ---------- */
/* sfumature che seguono il colore della sezione: dichiarate su body, dove data-sec cambia --acc */
body{--acc-soft:color-mix(in srgb,var(--acc) 12%,transparent);--acc-line:color-mix(in srgb,var(--acc) 35%,var(--line));--acc-band:color-mix(in srgb,var(--acc) 18%,transparent)}
/* menu: icona a linea al posto del pallino, nel colore della sua sezione */
.mi{justify-content:flex-start;gap:14px}
.mi>span:last-child{margin-left:auto}
.mic{width:22px;height:22px;flex:none;color:#4fc3b8}
.mi.sm .mic{width:18px;height:18px}

function autoClose(){                                             // ogni mese finito si fissa da solo: valori copiati come "foto" e segnati come chiusi automaticamente
  if(S.y>NY||!S.data.items.length)return;const last=S.y<NY?12:NM-1,C=S.data.conf=S.data.conf||{};let ch=false;
  for(let m=1;m<=last;m++){if(C[m])continue;
    let any=false;for(const i of S.data.items){const ks=Object.keys(i.v).map(Number).filter(k=>k<=m);if(!ks.length)continue;any=true;if(i.v[m]===undefined)i.v[m]=lastV(i,m);if(perQ(i)){const H=i.qh=i.qh||{};if(H[m]===undefined)H[m]=qAt(i,m);}}
    if(any){C[m]="auto:"+new Date().toISOString().slice(0,10);ch=true;}}
  if(ch)save();
}
const isAuto=c=>typeof c==="string"&&c.startsWith("auto:"),confDate=c=>new Date(isAuto(c)?c.slice(5):c).toLocaleDateString(L("it-IT","en-GB"));
function toClose(){                                               // {y,m} del mese chiuso automaticamente da controllare, oppure null
  if(S.y!==NY||!uid)return null;
  const y=NM>1?NY:NY-1,m=NM>1?NM-1:12;                            // a gennaio si conferma dicembre dell'anno prima
  const d=y===S.y?S.data:LS.get(kd(y),null);
  if(!d||!(d.items||[]).length)return null;                       // senza voci non c'è niente da confermare
  const c=(d.conf||{})[m];if(!c||!isAuto(c))return null;          // si mostra solo per un mese chiuso in automatico e non ancora controllato
  if(LS.get("ack:"+uid+":"+y+"-"+m,0))return null;
  return {y,m,c};
}
function monthNote(){
  const c=toClose();if(!c)return "";const n=mName(c.m);
  return `<div class="card note"><b>${L(MESI[c.m-1]+" è stato chiuso automaticamente",MESI[c.m-1]+" was closed automatically")}</b>
  <p class="mini" style="margin:6px 0 10px">${L("I valori di fine mese sono stati fissati da soli. Se un saldo non torna, correggilo: la modifica resta.","End-of-month values were fixed automatically. If a balance looks wrong, correct it: the change sticks.")}</p>
  <div class="row"><button class="go" data-a="close" data-y="${c.y}" data-m="${c.m}">${L("Controlla "+n,"Check "+n)}</button><button class="ghost" data-a="ack" data-y="${c.y}" data-m="${c.m}">Ok</button></div></div>`;
}

function tr(e){const m=(e.message||"").toLowerCase();
  if(!navigator.onLine||m.includes("fetch")) return "Sei offline: serve internet per registrarti o accedere la prima volta.";
  if(m.includes("invalid login")) return "Email o password errati.";
  if(m.includes("already registered")) return "Questa email è già registrata: usa Accedi.";
  if(m.includes("at least")) return "La password deve avere almeno 6 caratteri.";
  if(m.includes("not confirmed")) return "Conferma prima l'email con il link che ti abbiamo inviato.";
  if(m.includes("rate limit")) return "Troppi tentativi: riprova tra qualche minuto.";
  if(m.includes("valid email")||m.includes("invalid")) return "Controlla l'indirizzo email.";
  return "Errore: "+e.message;}

const ckYears=()=>"years:"+uid, ckLast=()=>"lastYear:"+uid, kd=y=>`data:${uid}:${y}`, kdirty=()=>"dirty:"+uid;

async function loadYears(){
  const cached=LS.get(ckYears(),[]);
  if(D||!navigator.onLine){ if(D&&!cached.length){const y=new Date().getFullYear();LS.set(ckYears(),[y]);return [y];} return cached; }
  const {data,error}=await db.from("years").select("year").order("year",{ascending:false});
  if(error){ if(cached.length) return cached; throw error; }
  let list=data.map(r=>r.year);
  if(!list.length){const y=new Date().getFullYear();const {error:e2}=await db.from("years").insert({year:y});if(e2)throw e2;list=[y];}
  LS.set(ckYears(),list);return list;
}
async function pull(y){
  let local=LS.get(kd(y),null);
  if(D||!navigator.onLine||LS.get(kdirty(),[]).includes(y)) return local||{items:[]};
  try{const {data,error}=await db.from("year_data").select("data").eq("year",y).maybeSingle();
    if(!error&&data){local=data.data;LS.set(kd(y),local);}}catch{}
  return local||{items:[]};
}
async function push(){
  if(D||!navigator.onLine||!uid){net();return;}
  for(const y of LS.get(kdirty(),[])){
    const {error}=await db.from("year_data").upsert({year:y,data:LS.get(kd(y))},{onConflict:"user_id,year"});
    if(!error) LS.set(kdirty(),LS.get(kdirty(),[]).filter(x=>x!==y));
  }
  if(LS.get(kcdirty(),0)){const {error}=await db.from("user_settings").upsert({user_id:uid,data:CFG},{onConflict:"user_id"});if(!error)LS.set(kcdirty(),0);}
  net();
}
function save(){LS.set(kd(S.y),S.data);const d=LS.get(kdirty(),[]);if(!d.includes(S.y))LS.set(kdirty(),[...d,S.y]);net();push();}

function pmsg(t,err){const p=$("pmsg");p.textContent=t;p.style.color=err?"var(--err)":"var(--mut)";}

async function route(session){
  if(!session){uid=null;screen("auth");net();return;}
  if(uid===session.user.id) return;
  uid=session.user.id;S.email=session.user.email;S.token=session.access_token||"";
  await cfgPull();simLoad();if(!LS.get("since:"+uid,""))LS.set("since:"+uid,new Date().toISOString());
  try{years=await loadYears();}
  catch(e){years=[];screen("pick");renderTiles();return pmsg(e.code==="42P01"?"Tabella mancante: esegui lo script SQL su Supabase.":"Errore: "+e.message,true);}
  if(!years.includes(NY)&&await ensureYear(NY))localStorage.setItem(ckLast(),NY);     // il 1° gennaio l'anno nuovo nasce da solo
  const last=Number(localStorage.getItem(ckLast()));
  if(years.includes(last)) openYear(last); else showPicker();
  net();push();
}
function showPicker(){screen("pick");renderTiles();pmsg("");$("addform").hidden=true;}
async function ensureYear(y){
  if(!D){if(!navigator.onLine)return false;const {error}=await db.from("years").insert({year:y});if(error)return false;}
  years=[...years,y].sort((a,b)=>b-a);LS.set(ckYears(),years);return true;
}
const lastV=(it,m)=>{for(let k=m;k>=1;k--)if(it.v[k]!==undefined)return it.v[k];return 0;};
async function carryOver(y){                                      // riporto dall'anno prima: stesse voci, dicembre come partenza di gennaio, budget, obiettivi senza spunte
  const prev=years.filter(x=>x<y).sort((a,b)=>b-a)[0];if(!prev)return false;
  const p=await pull(prev);if(!p||!(p.items||[]).length)return false;
  S.data.items=p.items.map(i=>{const v=lastV(i,12),n={...i,v:{},qh:{}};if(v)n.v[1]=v;const q=qAt(i,12);if(q)n.qh[1]=q;return n;});
  if(p.budget)S.data.budget={...p.budget};
  if(p.goals)S.data.goals=p.goals.map(g=>({...g,st:{}}));
  if(p.reb)S.data.reb=JSON.parse(JSON.stringify(p.reb));
  S.data.carried=prev;save();return true;
}
async function openYear(y){
  localStorage.setItem(ckLast(),y);S.y=y;
  const now=new Date();S.m=y===now.getFullYear()?now.getMonth()+1:12;
  S.data=await pull(y);S.data.items=S.data.items||[];
  if(!S.data.items.length&&!S.data.carried)await carryOver(y);
  if(D&&!S.data.items.length&&y===NY&&!LS.get("noseed:"+uid,0))seed(); else if(snap())save();
  seedExp();applyRec();autoClose();
  refresh(true);
  renderHome();screen("home");showWelcome();
}
function renderTiles(){
  const t=$("tiles");t.innerHTML="";
  years.forEach((y,i)=>{const b=document.createElement("button");b.className="tile t"+(i%4);b.textContent=y;b.onclick=()=>openYear(y);t.appendChild(b);});
  const add=document.createElement("button");add.className="tile add";add.textContent="+ Aggiungi anno";
  add.onclick=()=>{if(!D&&!navigator.onLine)return pmsg("Serve internet per aggiungere un anno.",true);
    $("addform").hidden=false;$("newyear").value=years.length?Math.max(...years)+1:new Date().getFullYear();$("newyear").focus();};
  t.appendChild(add);
}
$("addyear").onclick=async()=>{
  const y=Number($("newyear").value);
  if(!Number.isInteger(y)||y<1990||y>2100) return pmsg("Inserisci un anno tra 1990 e 2100.",true);
  if(years.includes(y)) return pmsg("Quest'anno esiste già.",true);
  if(!D){const {error}=await db.from("years").insert({year:y});if(error)return pmsg("Errore: "+error.message,true);}
  years=[...years,y].sort((a,b)=>b-a);LS.set(ckYears(),years);
  renderTiles();$("addform").hidden=true;pmsg("Anno "+y+" aggiunto.");
};

function chartSvg(P,big){
  const W=340,H=big?210:60,l=big?46:4,r=big?10:4,t=big?12:6,b=big?26:6,n=P.length;
  const vs=P.flatMap(p=>[p.e,p.u]);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi-lo<1e-9){hi+=Math.abs(hi)*0.01||1;lo-=Math.abs(lo)*0.01||1;}          // una sola quota: evito la divisione per zero
  if(big){const pad=(hi-lo)*0.08;lo-=pad;hi+=pad;}
  const X=i=>n>1?l+i*(W-l-r)/(n-1):(W+l-r)/2,Y=v=>t+(hi-v)/(hi-lo)*(H-t-b);
  const line=(k,c)=>n>1?`<polyline class="ln ${c}" points="${P.map((p,i)=>X(i).toFixed(1)+","+Y(p[k]).toFixed(1)).join(" ")}"${big?"":' vector-effect="non-scaling-stroke"'}/>`
    :`<circle class="${c}d" cx="${X(0).toFixed(1)}" cy="${Y(P[0][k]).toFixed(1)}" r="4"/>`;
  let g="";
  if(big){g=[lo,(lo+hi)/2,hi].map(v=>`<line class="grid" x1="${l}" x2="${W-r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ax" x="${l-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${kfmt(v)}</text>`).join("");
    g+=P.map((p,i)=>(n<=8||i%2===(n-1)%2)?`<text class="ax" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${MESI[p.m-1].slice(0,3)}</text>`:"").join("");}
  return `<svg class="${big?"chart":""}" viewBox="0 0 ${W} ${H}"${big?"":' preserveAspectRatio="none"'} xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${L("Grafico del patrimonio","Net worth chart")}">${g}${line("u","ln2")}${line("e","ln1")}</svg>`;
}

function setECat(c,sub){                                          // seleziona la categoria nel modulo spesa senza ridisegnarlo (non si perde quanto scritto)

function saveExp(){
  const m=$("xmsg"),w=$("ew").value.trim(),a=parseNum($("ea").value),d=$("edt").value,c=$("ec2").value,s=$("es2").value.trim()||subsOf(c)[0]||"Varie",n=$("en2").value.trim();
  if(!w)return m.textContent=L("Scrivi cosa hai comprato.","Write what you bought.");
  if(!(a>0)||!isFinite(a))return m.textContent=L("Inserisci un importo maggiore di 0.","Enter an amount greater than 0.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||Number(d.slice(0,4))!==S.y)return m.textContent=L("La data deve essere dell'anno ","The date must be in ")+S.y+".";
  const k=w.toLowerCase();if(!CFG.dict[k]||CFG.dict[k][0]!==c||CFG.dict[k][1]!==s){CFG.dict[k]=[c,s];cfgSave();}
  let e=S.eedit&&EXP().find(x=>x.id===S.eedit);
  if(e)Object.assign(e,{w,a,d,c,s,n});
  else{e={id:nid(),w,a,d,c,s,n};EXP().push(e);
    if($("erec")&&$("erec").checked){const r={id:nid(),w,c,s,a,n,day:Number(d.slice(8,10)),from:d.slice(0,7)};CFG.rec.push(r);e.r=r.id;cfgSave();applyRec();}}
  S.eedit=null;S.eword=undefined;S.delAsk=false;save();renderExp();$("xmsg").textContent=L("Spesa salvata.","Expense saved.");
}

    <div class="row" style="margin-top:8px"><select data-rc="${r.id}" style="margin:0;flex:1">${ECATS().map(([id,n])=>`<option value="${id}"${id===r.c?" selected":""}>${esc(n)}</option>`).join("")}</select><input data-rs="${r.id}" list="subs-${r.c}" value="${esc(r.s||"")}" placeholder="${L("Sottocategoria","Subcategory")}" style="margin:0;flex:1"><button class="ghost" data-a="rdel" data-id="${r.id}" style="padding:4px 8px">✕</button></div>
    <p class="mini" style="margin:6px 0 0">${L("Attiva da","Active since")} ${r.from||"—"} · ${L("ogni mese il giorno","every month on day")} ${r.day}</p></div>`).join("")+`</div>
    ${ECATS().map(([id])=>`<datalist id="subs-${id}">${subsOf(id).map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`).join("")}

    <p class="mini" style="display:block">${L("Le modifiche valgono per le prossime spese inserite in automatico; quelle già registrate restano come sono (le correggi dalla lista spese).","Changes apply to the next automatic entries; the ones already recorded stay as they are (fix them from the expense list).")}</p>`;
  $("rec").innerHTML=h;
}
function saveRec(){
  let n=0,bad=0;
  CFG.rec.forEach(r=>{const g=k=>document.querySelector(`#rec [data-${k}="${r.id}"]`);const w=g("rw"),a=g("ra"),d=g("rd"),c=g("rc"),su=g("rs");if(!w)return;
    const nw=w.value.trim(),na=parseNum(a.value),nd=parseInt(d.value,10),nc=c.value,ns=su.value.trim()||subsOf(nc)[0]||"Varie";
    if(!nw||!(na>0)||!(nd>=1&&nd<=31)){bad++;return;}
    if(r.w!==nw||r.a!==na||r.day!==nd||r.c!==nc||r.s!==ns){r.w=nw;r.a=na;r.day=nd;r.c=nc;r.s=ns;n++;const k=nw.toLowerCase();if(!CFG.dict[k])CFG.dict[k]=[nc,ns];}});
  if(n)cfgSave();renderRec();const m=$("rmsg");if(m){m.style.color=bad?"var(--err)":"var(--ok)";m.textContent=bad?L("Controlla parola, importo (maggiore di 0) e giorno (1–31).","Check word, amount (above 0) and day (1–31)."):n?n+L(" ricorrenti aggiornate."," recurring expenses updated."):L("Nessuna modifica.","No change.");}
}

/* ---- Andamento spese ---- */
function renderTrend(){
  const T=sumE(S.m),P=S.m>1?sumE(S.m-1):0,A=yAvg(m=>sumE(m));
  let h=back(L("Andamento spese","Spending trend"),"trend")+mbar();
  h+=`<div class="card"><div class="mini">${L("Spese di","Expenses in")} ${mName(S.m)}</div><div class="big">${eur(T)}</div>${cmpRow(T,P,A,true)}<p class="mini" style="margin:6px 0 0">${L("Media annua","Yearly average")}: ${eur(A)}</p></div>`;
  h+=`<p style="margin:12px 0"><button class="${S.cmp?"ghost":"go"}" data-a="cmp" style="width:100%">${S.cmp?L("Chiudi confronto","Close comparison"):L("Confronta mesi","Compare months")}</button></p>`;
  if(S.cmp){
    const M=S.cmpM||[S.m],C=S.cmpC||"";
    h+=`<p class="mini" style="margin:0 0 4px">${L("Tocca i mesi da confrontare, quanti vuoi.","Tap the months to compare, as many as you like.")}</p><div class="chips">${[...Array(lastM()).keys()].map(i=>i+1).map(m=>`<button class="chip" data-a="cm" data-m="${m}" aria-pressed="${M.includes(m)}">${MESI[m-1].slice(0,3)}</button>`).join("")}<button class="chip" data-a="cmall" aria-pressed="${M.length===lastM()}">${L("Tutti","All")}</button></div>`;
    h+=`<label for="cmpc">${L("Filtra per categoria","Filter by category")}</label><select id="cmpc"><option value="">${L("Tutte le categorie","All categories")}</option>${ECATS().map(([id,n])=>`<option value="${id}"${C===id?" selected":""}>${n}</option>`).join("")}</select>`;
    const rows=C?[...new Set(EXP().filter(e=>e.c===C).map(e=>e.s))].map(s=>[s,m=>sumE(m,C,s)]):ECATS().map(([id,n])=>[n,m=>sumE(m,id)]);
    const heat=(v,vals)=>{if(M.length<2)return "";const mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<0.005||!v)return "";const t=(v-mn)/(mx-mn);   // verde = mese meno caro, rosso = più caro
      return ` style="background:${t<0.5?`color-mix(in srgb,var(--ok) ${Math.round((0.5-t)*2*42)}%,transparent)`:`color-mix(in srgb,var(--err) ${Math.round((t-0.5)*2*42)}%,transparent)`}"`;};
    const line=(n,f,bold)=>{const vals=M.map(f);return `<tr><td>${bold?"<b>"+n+"</b>":esc(n)}</td>${M.map((m,i)=>`<td${heat(vals[i],vals)}>${bold?"<b>"+eur(vals[i])+"</b>":eur(vals[i])}</td>`).join("")}</tr>`;};
    h+=`<div class="card ug" style="overflow-x:auto"><table class="tbl"><tr><th></th>${M.map(m=>`<th>${MESI[m-1].slice(0,3)}</th>`).join("")}</tr>`+rows.map(([n,f])=>line(n,f,false)).join("")+line(L("Totale","Total"),m=>sumE(m,C),true)+`</table></div>`
      +(M.length>1?`<p class="mini" style="margin:6px 0 0">${L("Per ogni riga: verde il mese in cui hai speso meno, rosso quello in cui hai speso di più, sfumature nel mezzo.","Per row: green the month you spent least, red the one you spent most, shades in between.")}</p>`:"");
    if(C){const mx=Math.max(1,...[...Array(lastM()).keys()].map(i=>sumE(i+1,C)));
      h+=`<h2 class="gt">${ECN(C)} ${L("mese per mese","month by month")}</h2><div class="card ug">`+[...Array(lastM()).keys()].map(i=>{const v=sumE(i+1,C);return `<div class="hrow"><span style="width:40px">${MESI[i].slice(0,3)}</span><span class="bar" style="flex:1;margin:0"><i style="width:${v/mx*100}%"></i></span><span style="width:90px;text-align:right">${eur(v)}</span></div>`;}).join("")+`</div>`;}
  }else{
    h+=`<div class="cats">`+ECATS().map(([id,n])=>{const v=sumE(S.m,id),p=S.m>1?sumE(S.m-1,id):0,open=S.tcat===id,b=Number((S.data.budget||{})[id])||0;
      const bud=b?`<small class="mini" style="display:block">${L("budget","budget")} ${eur(b)}${v>b?" · <b style=\"color:var(--err)\">"+L("sforato di","over by")+" "+eur(v-b)+"</b>":""}</small><span class="bar" style="display:block;width:90px;margin:4px 0 0 auto"><i style="width:${Math.min(100,v/b*100)}%${v>b?";background:var(--err)":""}"></i></span>`:"";
      let x=`<button class="catbtn" data-a="tc" data-c="${id}" aria-expanded="${open}"><span>${n}</span><span class="r"><b>${eur(v)}</b>${pillInv(v,p)}${bud}</span></button>`;
      if(open){const ss=[...new Set(EXP().filter(e=>mOf(e.d)===S.m&&e.c===id).map(e=>e.s))];
        x+=`<div class="card ug" style="margin-top:-6px">`+(ss.length?ss.map(s=>`<div class="hrow"><span>${esc(s)}</span><span><b>${eur(sumE(S.m,id,s))}</b>${S.m>1?pillInv(sumE(S.m,id,s),sumE(S.m-1,id,s)):""}</span></div>`).join(""):`<p class="mini" style="margin:8px 0">${L("Nessuna spesa in questo mese.","No expenses this month.")}</p>`)+`</div>`;}
      return x;}).join("")+`</div>`;
  }
  $("trend").innerHTML=h;

/* ---- Grafico spese: barre per mese, un colore per categoria ---- */
function renderGraph(){
  const n=lastM(),hide=S.gHide||[],cats=ECATS().filter(c=>!hide.includes(c[0])),gm=S.gm&&S.gm<=n?S.gm:S.m;
  const yTot={};ECATS().forEach(([id])=>{yTot[id]=0;for(let m=1;m<=n;m++)yTot[id]+=sumE(m,id);});const yAll=Object.values(yTot).reduce((a,b)=>a+b,0);
  const tot=m=>cats.reduce((a,[id])=>a+sumE(m,id),0),mx=Math.max(1,...[...Array(n).keys()].map(i=>tot(i+1)));
  let h=back(L("Grafico spese","Expense chart"),"graph")+`<p class="mini">${L("Ogni barra è un mese, ogni colore una categoria. Tocca una categoria nella legenda per nasconderla, tocca una barra per vedere il dettaglio del mese.","Each bar is a month, each colour a category. Tap a category in the legend to hide it, tap a bar to see that month's detail.")}</p>`;
  const W=340,H=230,l=8,r=8,t=22,bt=26,step=(W-l-r)/n,bw=step*0.62;let g="";

    if(T)g+=`<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${kfmt(T)}</text>`;
    g+=`<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle"${m===gm?' font-weight="700"':""}>${MESI[i].slice(0,3)}</text>`;
    g+=`<rect data-a="xgbar" data-m="${m}" x="${(l+i*step).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}" fill="transparent" style="cursor:pointer"/>`;}
  h+=`<div class="card"><svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${L("Spese per mese e categoria","Expenses by month and category")}">${g}</svg></div>`;
  h+=`<div class="card ug">`+ECATS().map(([id,nm])=>`<button class="hrow lg${hide.includes(id)?" off":""}" data-a="xgcat" data-c="${id}" style="width:100%;background:none;border:0;font:inherit;color:inherit;cursor:pointer"><span><i class="dot" style="background:${ECOL(id)}"></i>${esc(nm)}</span><span class="mini">${eur(yTot[id])}${yAll?" · "+pct(yTot[id]/yAll*100):""}</span></button>`).join("")+`</div>`;
  const rows=cats.map(([id,nm])=>[id,nm,sumE(gm,id)]).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]),T=tot(gm);
  h+=`<h2 class="gt">${MESI[gm-1]}: ${eur(T)}</h2><div class="card ug">`+(rows.length?rows.map(([id,nm,v])=>`<div class="hrow"><span><i class="dot" style="background:${ECOL(id)}"></i>${esc(nm)}</span><span><b>${eur(v)}</b> <small class="mini">${pct(v/T*100)}</small></span></div>`).join(""):`<p class="mini" style="margin:8px 0">${L("Nessuna spesa in questo mese.","No expenses this month.")}</p>`)+`</div>`;

const IPAL=["#14b8a6","#f59e0b","#8b5cf6","#ec4899","#3b82f6","#84cc16","#f97316","#06b6d4"],ICOL=c=>IPAL[Math.max(0,CFG.inc.indexOf(c))%IPAL.length];

  const tot=m=>cats.reduce((a,c)=>a+sumI(m,c),0),avg=yAvg(tot),mx=Math.max(1,avg,...[...Array(n).keys()].map(i=>tot(i+1)));
  let h=back(L("Grafico entrate","Income chart"),"igraph")+`<p class="mini">${L("Ogni barra è un mese, ogni colore una categoria; la linea tratteggiata è la media annua. Tocca una categoria per nasconderla, tocca una barra per il dettaglio del mese.","Each bar is a month, each colour a category; the dashed line is the yearly average. Tap a category to hide it, tap a bar for that month's detail.")}</p>`;
  const W=340,H=230,l=8,r=8,t=22,bt=26,step=(W-l-r)/n,bw=step*0.62,Y=v=>H-bt-v/mx*(H-t-bt);let g="";
  for(let i=0;i<n;i++){const m=i+1,x=l+i*step+(step-bw)/2;let y=H-bt;const T=tot(m);
    for(const c of cats){const v=sumI(m,c);if(!v)continue;const hh=v/mx*(H-t-bt);y-=hh;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hh,0.5).toFixed(1)}" fill="${ICOL(c)}"${m===gm?"":' opacity=".8"'}/>`;}
    if(T)g+=`<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${kfmt(T)}</text>`;
    g+=`<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle"${m===gm?' font-weight="700"':""}>${MESI[i].slice(0,3)}</text>`;
    g+=`<rect data-a="xigbar" data-m="${m}" x="${(l+i*step).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}" fill="transparent" style="cursor:pointer"/>`;}
  if(avg>0)g+=`<line x1="${l}" x2="${W-r}" y1="${Y(avg).toFixed(1)}" y2="${Y(avg).toFixed(1)}" stroke="var(--mut)" stroke-dasharray="4 4" stroke-width="1.2"/><text class="ax" x="${W-r}" y="${(Y(avg)-4).toFixed(1)}" text-anchor="end">${L("media","avg")} ${kfmt(avg)}</text>`;
  h+=`<div class="card"><svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${L("Entrate per mese e categoria","Income by month and category")}">${g}</svg></div>`;

function saveValid(){
  const ren={},dict={};let n=0;                                   // ren: vecchia parola -> nuova
  document.querySelectorAll("#valid input[data-wn]").forEach(e=>{const w=e.dataset.wn,nw=e.value.trim().toLowerCase()||w,c=document.querySelector(`#valid select[data-wc="${CSS.escape(w)}"]`).value,s=document.querySelector(`#valid input[data-ws="${CSS.escape(w)}"]`).value.trim()||subsOf(c)[0]||"Varie";
    dict[nw]=[c,s];ren[w]=nw;});
  Object.keys(CFG.dict).forEach(w=>{if(!(w in ren))dict[w]=CFG.dict[w];});   // parole nascoste dal filtro di ricerca restano
  const incRen={};document.querySelectorAll("#valid input[data-ic]").forEach(e=>{const o=CFG.inc[Number(e.dataset.ic)],nw=e.value.trim();if(o&&nw&&nw!==o)incRen[o]=nw;});
  const fix=d=>{let ch=false;(d.exp||[]).forEach(e=>{const w=e.w.toLowerCase();if(w in ren){const nw=ren[w],[c,s]=dict[nw];if(e.w!==nw||e.c!==c||e.s!==s){e.w=nw;e.c=c;e.s=s;ch=true;n++;}}});
    (d.inc||[]).forEach(e=>{if(e.c in incRen){e.c=incRen[e.c];ch=true;n++;}});return ch;};
  const dirty=LS.get(kdirty(),[]);
  for(const y of years){if(y===S.y)continue;const d=LS.get(kd(y),null);if(d&&fix(d)){LS.set(kd(y),d);if(!dirty.includes(y))dirty.push(y);}}
  LS.set(kdirty(),dirty);fix(S.data);
  CFG.rec.forEach(r=>{const w=r.w.toLowerCase();if(w in ren){r.w=ren[w];[r.c,r.s]=dict[ren[w]];}});
  document.querySelectorAll("#valid input[data-cn]").forEach(e=>{const c=CFG.cats.find(x=>x[0]===e.dataset.cn);if(c&&e.value.trim())c[1]=e.value.trim();});
  document.querySelectorAll("#valid input[data-cc]").forEach(e=>{const c=CFG.cats.find(x=>x[0]===e.dataset.cc);if(c&&/^#[0-9a-f]{6}$/i.test(e.value))c[2]=e.value;});
  CFG.dict=dict;CFG.inc=CFG.inc.map(c=>incRen[c]||c);CFG.setupValid=true;cfgSave();save();renderValid();
  $("vmsg").textContent=L("Salvato. ","Saved. ")+n+L(" voci corrette."," entries updated.");
}
function addCat(name){
  let id=name.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"cat",b=id,k=2;while(CFG.cats.some(c=>c[0]===id))id=b+"-"+(k++);
  const used=CFG.cats.map(c=>c[2]),col=PAL.find(c=>!used.includes(c))||PAL[CFG.cats.length%PAL.length];
  CFG.cats.push([id,name,col]);cfgSave();
}
function delCat(id){                                              // parole, spese, ricorrenti e budget passano in "altro"
  const to="altro";if(id===to)return;
  Object.keys(CFG.dict).forEach(w=>{if(CFG.dict[w][0]===id)CFG.dict[w]=[to,CFG.dict[w][1]];});
  CFG.rec.forEach(r=>{if(r.c===id)r.c=to;});
  const fix=d=>{let ch=false;(d.exp||[]).forEach(e=>{if(e.c===id){e.c=to;ch=true;}});if(d.budget&&d.budget[id]!==undefined){delete d.budget[id];ch=true;}return ch;};
  const dirty=LS.get(kdirty(),[]);
  for(const y of years){if(y===S.y)continue;const d=LS.get(kd(y),null);if(d&&fix(d)){LS.set(kd(y),d);if(!dirty.includes(y))dirty.push(y);}}
  LS.set(kdirty(),dirty);if(fix(S.data))save();
  CFG.cats=CFG.cats.filter(c=>c[0]!==id);cfgSave();
}

/* ---------- simulatore PIC e PAC: asset allocation, inflazione, costi, tasse, incertezza ---------- */
const DEF_SIM=()=>({years:20,infl:2,real:true,ter:0.2,tax:26,bank:0,corr:0.3,mc:false,pic:true,picC:10000,pac:true,pacM:200,pacY:0,pacC:0,bankC:10000,bankM:0,
  alloc:[["Azioni globali",60,7,15],["Obbligazioni",30,3,5],["Oro",10,4,15]]});                 // [nome, peso %, rendimento atteso %, volatilità %]
const SIM_PRESETS=[["az100","Azionario 100%",[["Azioni globali",100,7,15]]],["b6040","60 / 40",[["Azioni globali",60,7,15],["Obbligazioni",40,3,5]]],
  ["gold","50 / 30 / 20 con oro",[["Azioni globali",50,7,15],["Obbligazioni",30,3,5],["Oro",20,4,15]]],["prud","Prudente",[["Azioni globali",30,7,15],["Obbligazioni",50,3,5],["Liquidità",20,2,0.5]]]];
let SIM=DEF_SIM();
const ksim=()=>"sim:"+uid;
function simLoad(){const s=LS.get(ksim(),null);SIM=s?Object.assign(DEF_SIM(),s):DEF_SIM();if(!Array.isArray(SIM.alloc)||!SIM.alloc.length)SIM.alloc=DEF_SIM().alloc;}
function simSave(){LS.set(ksim(),SIM);}
const num=(x,d)=>{const v=parseNum(String(x));return v===null||!isFinite(v)?d:v;};
// generatore di numeri casuali con seme fisso: stessi parametri, stesso grafico
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function simRun(){
  const N=Math.max(1,Math.round(num(SIM.years,20)*12)),infl=num(SIM.infl,0)/100,ter=num(SIM.ter,0)/100,bank=num(SIM.bank,0)/100,corr=Math.min(1,Math.max(-0.5,num(SIM.corr,0.3)));
  const A=SIM.alloc.map(a=>[a[0],Math.max(0,num(a[1],0)),num(a[2],0)/100,Math.max(0,num(a[3],0))/100]),wsum=A.reduce((s,a)=>s+a[1],0)||1,w=A.map(a=>a[1]/wsum);
  const mu=A.reduce((s,a,i)=>s+w[i]*a[2],0);let v=0;A.forEach((a,i)=>A.forEach((b,j)=>{v+=w[i]*w[j]*a[3]*b[3]*(i===j?1:corr);}));const sig=Math.sqrt(Math.max(0,v));
  const net=mu-ter,g=Math.pow(1+net,1/12),gb=Math.pow(1+bank,1/12),D=t=>Math.pow(1+infl,t/12);
  const picC=SIM.pic?Math.max(0,num(SIM.picC,0)):0,pacM=SIM.pac?Math.max(0,num(SIM.pacM,0)):0,pacC=SIM.pac?Math.max(0,num(SIM.pacC,0)):0;
  const pacN=SIM.pac?(num(SIM.pacY,0)>0?Math.min(N,Math.round(num(SIM.pacY,0)*12)):N):0;
  const none=!SIM.pic&&!SIM.pac,bC=none?Math.max(0,num(SIM.bankC,0)):0,bM=none?Math.max(0,num(SIM.bankM,0)):0;   // senza PIC né PAC: solo soldi in banca
  const pic=[picC],pac=[pacC],bnk=[picC+pacC+bC],cPic=picC,cPac=[pacC];           // serie mese per mese (nominali)
  for(let t=1;t<=N;t++){const c=t<=pacN?pacM:0;pic.push(pic[t-1]*g);pac.push((pac[t-1]+c)*g);bnk.push((bnk[t-1]+c+bM)*gb);cPac.push(cPac[t-1]+c);}
  const irr=(flows,V)=>{let lo=-0.99,hi=5;for(let i=0;i<80;i++){const r=(lo+hi)/2,m=Math.pow(1+r,1/12);let s=0;flows.forEach((f,t)=>{s+=f*Math.pow(m,N-t);});if(s>V)hi=r;else lo=r;}return (lo+hi)/2;};
  const tax=num(SIM.tax,0)/100,fin=(V,C,flows)=>{const gain=V-C,tx=Math.max(0,gain)*tax,netV=V-tx;return {V,C,gain,tx:tx,net:netV,real:netV/D(N),irr:C>0?irr(flows,V):0};};
  const flowsPic=Array(N+1).fill(0);flowsPic[0]=picC;const flowsPac=Array(N+1).fill(0);flowsPac[0]=pacC;for(let t=1;t<=pacN;t++)flowsPac[t-1]+=pacM;
  const out={N,mu,sig,net,infl,real:(1+net)/(1+infl)-1,wsum,pic,pac,bnk,cPac,D,picC,pacN,pacM,
    rPic:SIM.pic?fin(pic[N],cPic,flowsPic):null,rPac:SIM.pac?fin(pac[N],cPac[N],flowsPac):null,
    rBank:none?{C:bC+bM*N,V:bnk[N],real:bnk[N]/D(N)}:null,
    bPic:SIM.pic?picC*Math.pow(gb,N)/D(N):0,bPac:SIM.pac?(()=>{let b=pacC;for(let t=1;t<=N;t++)b=(b+(t<=pacN?pacM:0))*gb;return b/D(N);})():0};
  if(SIM.mc&&sig>0){                                                               // Monte Carlo: 200 scenari con rendimenti mensili casuali
    const K=200,r=rng(12345),sm=sig/Math.sqrt(12),mm=Math.log(1+net)/12-sm*sm/2,P=[],Q=[];let winP=0,winQ=0;
    for(let k=0;k<K;k++){let a=picC,b=pacC;const pa=[a],pb=[b];
      for(let t=1;t<=N;t++){const u1=r()||1e-9,u2=r(),z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2),f=Math.exp(mm+sm*z),c=t<=pacN?pacM:0;a*=f;b=(b+c)*f;pa.push(a);pb.push(b);}
      P.push(pa);Q.push(pb);if(a>picC*Math.pow(gb,N))winP++;if(b>out.bPac*D(N))winQ++;}
    const band=(S)=>{const lo=[],md=[],hi=[];for(let t=0;t<=N;t++){const col=S.map(s=>s[t]).sort((x,y)=>x-y);lo.push(col[Math.floor(K*0.1)]);md.push(col[Math.floor(K*0.5)]);hi.push(col[Math.floor(K*0.9)]);}return {lo,md,hi};};
    out.mc={pic:SIM.pic?band(P):null,pac:SIM.pac?band(Q):null,winP:winP/K*100,winQ:winQ/K*100};
  }
  return out;
}
function simChart(R){
  const N=R.N,real=SIM.real,adj=(v,t)=>real?v/R.D(t):v,W=340,H=240,l=46,r=10,t=14,b=24;
  const series=[];if(SIM.pic)series.push(R.pic.map(adj));if(SIM.pac)series.push(R.pac.map(adj));series.push(R.bnk.map(adj));
  let mx=Math.max(1,...series.map(s=>Math.max(...s)));
  if(R.mc){if(R.mc.pic)mx=Math.max(mx,...R.mc.pic.hi.map(adj));if(R.mc.pac)mx=Math.max(mx,...R.mc.pac.hi.map(adj));}
  mx*=1.05;const X=i=>l+i*(W-l-r)/N,Y=v=>t+(1-v/mx)*(H-t-b),pts=s=>s.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  let g=[0,1/3,2/3,1].map(k=>`<line class="grid" x1="${l}" x2="${W-r}" y1="${Y(mx*k).toFixed(1)}" y2="${Y(mx*k).toFixed(1)}"/><text class="ax" x="${l-6}" y="${(Y(mx*k)+3.5).toFixed(1)}" text-anchor="end">${kfmt(mx*k)}</text>`).join("");
  const yrs=N/12,stepY=yrs>30?10:yrs>12?5:yrs>6?2:1;for(let y=0;y<=yrs+1e-9;y+=stepY)g+=`<text class="ax" x="${X(y*12).toFixed(1)}" y="${H-7}" text-anchor="middle">${y}${L("a","y")}</text>`;
  const band=(B,col)=>B?`<polygon points="${pts(B.hi.map(adj))} ${B.lo.map(adj).map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).reverse().join(" ")}" fill="${col}" opacity=".15"/>`:"";
  if(R.mc){g+=band(R.mc.pic,"var(--acc)")+band(R.mc.pac,"var(--c2)");}
  g+=`<polyline class="ln" style="stroke:var(--mut);stroke-dasharray:5 4;stroke-width:1.8" points="${pts(R.bnk.map(adj))}"/>`;
  if(SIM.pic)g+=`<polyline class="ln ln1" points="${pts(R.pic.map(adj))}"/>`;
  if(SIM.pac)g+=`<polyline class="ln ln2" points="${pts(R.pac.map(adj))}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${L("Simulazione PIC e PAC","Lump sum vs DCA simulation")}">${g}</svg>`;
}
