<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Vinyl HQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vinyl HQ">
<style>
/* ---- tema: cambia solo queste variabili per cambiare palette ---- */
:root{--bg:#0f1117;--c:#171a23;--b:#262b38;--t:#ece6d6;--m:#8a90a2;--a:#d9a93a;--ai:#14120b;--g:#6fb48a;--r:#c96b5e;--rad:12px;--sf:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:48px;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--sf);font-weight:700;margin:.5em 0 .3em;letter-spacing:-.01em}
h1{font-size:30px}h2{font-size:24px}h3{font-size:16px;color:var(--m);font-weight:600;margin-top:1.3em}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--b)}
.brand{display:flex;align-items:center;gap:8px;padding:12px 14px 2px;font-family:var(--sf);font-weight:700;font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;background:none;border:1px solid var(--b);color:var(--m);padding:7px 13px;border-radius:999px;font-size:14px}
nav button.on{background:var(--a);color:var(--ai);border-color:var(--a);font-weight:600}
main{padding:12px 14px;max-width:640px;margin:auto}
input,select,textarea{width:100%;padding:11px 12px;margin:4px 0;background:var(--bg);border:1px solid var(--b);color:var(--t);border-radius:10px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--a)}
label.ck{display:block;padding:6px 0}
button{font:inherit;cursor:pointer;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px 12px}
button.pri{background:var(--a);color:var(--ai);border-color:var(--a);font-weight:600;width:100%;margin:8px 0;padding:12px}
button.lnk{background:none;border:0;color:var(--m);width:100%;text-decoration:underline}
button.w{width:100%;margin:4px 0}
button.x{padding:2px 9px;margin-left:8px;border-radius:8px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--rad);padding:14px;margin:8px 0}
.card.hero{background:linear-gradient(180deg,color-mix(in srgb,var(--a) 14%,var(--c)),var(--c))}
.card.tap{cursor:pointer}.card.tap:active{border-color:var(--a)}
.card.sold{opacity:.55}.card.sold .tt,.card.sold .top b{text-decoration:line-through}
.eb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--m);font-weight:600}
.top{display:flex;justify-content:space-between;color:var(--a);font-weight:600}
.tt{font-family:var(--sf);font-size:18px;margin:4px 0;line-height:1.25}
.m{color:var(--m);font-size:13px}
.bd i{font-style:normal;font-size:11px;border:1px solid var(--a);color:var(--a);border-radius:999px;padding:1px 8px;margin:4px 6px 0 0;display:inline-block}
.bd i.v{border-color:var(--b);color:var(--m)}
.act{display:flex;gap:6px;margin-top:10px}.act button{flex:1;font-size:13px;padding:7px 2px}
.big{font-family:var(--sf);font-size:38px;line-height:1.1;margin:4px 0;font-variant-numeric:tabular-nums}
.kpi{font-family:var(--sf);font-size:clamp(20px,6.2vw,28px);line-height:1.15;margin:3px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--g)}.neg{color:var(--r)}
.line{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--b)}
.line:last-child{border:0}
.line.s{padding:3px 0;font-size:13px;border:0}
.sub{border-top:1px solid var(--b);margin-top:10px;padding-top:6px}
.rw{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--b);cursor:pointer}
.rw b{color:var(--a);font-variant-numeric:tabular-nums;min-width:52px}
.rw .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .p{text-align:right;font-size:13px;white-space:nowrap;line-height:1.3}
.rw.sold{opacity:.5}.rw.sold .n{text-decoration:line-through}
.note{border:1px solid var(--a);background:color-mix(in srgb,var(--a) 10%,var(--c));border-radius:var(--rad);padding:10px 14px;margin:8px 0;display:flex;align-items:center;gap:10px;font-size:14px}
.note span{flex:1}.note button{white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;margin:4px 0}.tools select{margin:0;flex:1;min-width:0}
.seg{display:flex;border:1px solid var(--b);border-radius:10px;overflow:hidden;flex:none;background:var(--bg)}.seg button{border:0;border-radius:0;padding:9px 12px;background:none;color:var(--m)}.seg button.on{background:var(--c);color:var(--t)}
#ov,#ov2{position:fixed;inset:0;background:#000a;display:none;overflow:auto;z-index:9;padding:12px;backdrop-filter:blur(4px)}
.modal{background:var(--bg);border:1px solid var(--b);border-radius:16px;padding:16px;max-width:520px;margin:auto}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g)}
#ov2{z-index:10}
#toast{position:fixed;left:12px;right:12px;bottom:20px;background:var(--a);color:var(--ai);padding:12px;border-radius:10px;display:none;z-index:20;font-weight:600;text-align:center}
.cov{float:right;width:60px;height:60px;object-fit:cover;border-radius:8px;margin-left:10px}
.lock{max-width:320px;margin:12vh auto;padding:20px;text-align:center}.lock svg{display:block;margin:0 auto 4px}
.code{font:600 18px/1.6 ui-monospace,Menlo,monospace;letter-spacing:2px;background:var(--c);border:1px dashed var(--a);border-radius:10px;padding:10px;text-align:center;margin:8px 0;user-select:all;overflow-wrap:anywhere}
.ch{width:100%;height:auto;display:block;margin-top:6px}.ch text{fill:var(--m);font-size:9px}.ch .ax{stroke:var(--b)}.ch .b0{fill:var(--m)}.ch .b1{fill:var(--a)}.ch .b2{fill:var(--g)}.ch .ln{fill:none;stroke:var(--a);stroke-width:2;stroke-linejoin:round}.ch .area{fill:var(--a);opacity:.15}
.lg{display:flex;gap:12px;font-size:12px;color:var(--m);margin-top:4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}.lg .b0{background:var(--m)}.lg .b1{background:var(--a)}.lg .b2{background:var(--g)}
</style></head><body>
<div id="app"></div><div id="ov"></div><div id="ov2"></div><div id="toast"></div>
<script>
const K='vhq2',KI='vhq2_in';
let S=(()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}})();
S.recs=S.recs||[];S.sales=S.sales||[];S.wd=S.wd||[];S.exp=S.exp||[];S.pin=S.pin||null;S.ui=S.ui||{view:'card',sort:'code'};
/* normalizza un disco (anche quelli importati dalla vecchia app, dove c'era la spunta "pv") */
const norm=x=>{x.src=x.src||(x.pv?'vinted':'me');delete x.pv;x.boosts=x.boosts||[];x.sold=!!x.sold;x.soldTo=x.soldTo||'';x.date=x.date||today();x.note=x.note||''};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
E=n=>(+n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'}),
sgn=n=>(n>0?'+':'')+E(n),
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),
today=()=>new Date().toISOString().slice(0,10),
acq=x=>(+x.buy||0)+(+x.ship||0),                         /* acquisto + spedizione */
bst=x=>(x.boosts||[]).reduce((a,b)=>a+(+b.amt||0),0),     /* somma dei boost del disco */
tot=x=>acq(x)+bst(x),                                      /* costo totale del disco */
pot=x=>(+x.est||0)-tot(x),                                 /* guadagno potenziale: stima − costo */
age=x=>Math.max(0,Math.round((Date.now()-new Date(x.date))/864e5)),
sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0),
rec=id=>S.recs.find(r=>r.id==id),
isV=s=>(s.app||'').toLowerCase()=='vinted',
cls=n=>n>=0?'pos':'neg',
go=t=>{tab=t;render()},
LOGO=s=>`<svg width=${s} height=${s} viewBox="0 0 100 100" aria-hidden=true><circle cx=50 cy=50 r=47 fill="#0b0b0d"/><circle cx=50 cy=50 r=41 fill=none stroke="#1d1d24" stroke-width=1/><circle cx=50 cy=50 r=35 fill=none stroke="#1d1d24" stroke-width=1/><circle cx=50 cy=50 r=29 fill=none stroke="#1d1d24" stroke-width=1/><path d="M12 50A38 38 0 0 1 50 12" fill=none stroke="#34343f" stroke-width=1.6 stroke-linecap=round/><circle cx=50 cy=50 r=18 fill="var(--a)"/><text x=42.5 y=54.5 text-anchor=middle font-family="var(--sf)" font-weight=700 font-size=12.5 fill="var(--ai)">H</text><text x=57.5 y=54.5 text-anchor=middle font-family="var(--sf)" font-weight=700 font-size=12.5 fill="var(--ai)">Q</text><circle cx=50 cy=50 r=2.2 fill="#0b0b0d"/></svg>`;
S.recs.forEach(norm);
let tab='home',q='',flt='all',ed=null,lk='pin',unlocked=(()=>{try{return !!S.pin&&localStorage.getItem(KI)===S.pin}catch(e){return false}})();

/* ---- accesso: PIN, codice di recupero, passkey ---- */
async function hs(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vhq'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa('vhq'+s)}}
const RC=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',v=crypto.getRandomValues(new Uint8Array(16));return[...v].map((n,i)=>c[n%32]+(i%4==3&&i<15?'-':'')).join('')},
clean=s=>s.replace(/[-\s]/g,'').toUpperCase();
function lock(){
const v=lk=='rec'?`<p class=m>Inserisci il codice di recupero che hai salvato quando hai creato il PIN</p><input id=rc placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize=characters autocomplete=off><button class=pri onclick="recover()">Verifica</button><button class=lnk onclick="lk='pin';lock()">Indietro</button>`
:lk=='new'?`<p class=m>Codice corretto. Scegli un nuovo PIN</p><input id=pin type=password inputmode=numeric placeholder="Nuovo PIN (min. 4 caratteri)" onkeydown="if(event.key=='Enter')setPin()"><button class=pri onclick="setPin()">Salva PIN ed entra</button>`
:`<p class=m>${S.pin?'Inserisci il PIN per entrare':'Crea un PIN per proteggere l\'app'}</p><input id=pin type=password inputmode=numeric placeholder="PIN (min. 4 caratteri)" onkeydown="if(event.key=='Enter')unlock()"><label class=ck><input type=checkbox id=stay checked>Resta connesso su questo dispositivo</label><button class=pri onclick="unlock()">${S.pin?'Entra':'Crea PIN ed entra'}</button>${S.pk?'<button class=pri onclick="pkIn()" style="background:var(--c);color:var(--t);border-color:var(--b)">Entra con passkey</button>':''}${S.pin?`<button class=lnk onclick="lk='rec';lock()">PIN dimenticato?</button>`:''}`;
$('#app').innerHTML=`<div class=lock>${LOGO(84)}<h1>Vinyl HQ</h1>${v}</div>`}
async function unlock(){const p=$('#pin').value;if(p.length<4)return toast('Il PIN deve avere almeno 4 caratteri');const h=await hs(p);
if(!S.pin){S.pin=h;save();if($('#stay').checked)stay();unlocked=true;return showRc()}
if(S.pin!==h)return toast('PIN errato');if($('#stay').checked)stay();unlocked=true;render()}
async function showRc(){const c=RC();S.rcv=await hs(clean(c));save();
$('#ov2').style.display='block';$('#ov2').innerHTML=`<div class=modal style="margin-top:15vh"><h3>Codice di recupero</h3><p class=m>Se dimentichi il PIN, questo codice è l'unico modo per rientrare. Salvalo adesso in un posto sicuro (gestore di password, foto, foglio): non verrà più mostrato.</p><div class=code>${c}</div><button class=w onclick="navigator.clipboard?navigator.clipboard.writeText('${c}').then(()=>toast('Copiato')):toast('Copia non disponibile, trascrivilo')">Copia</button><button class=pri onclick="$('#ov2').style.display='none';render()">L'ho salvato</button></div>`}
async function recover(){if(!S.rcv)return toast('Non c\'è nessun codice di recupero. Puoi solo ripristinare un backup in un browser nuovo');if(await hs(clean($('#rc').value))!==S.rcv)return toast('Codice errato');lk='new';lock()}
async function setPin(){const p=$('#pin').value;if(p.length<4)return toast('Il PIN deve avere almeno 4 caratteri');S.pin=await hs(p);save();lk='pin';unlocked=true;stay();showRc()}
function chPin(){$('#ov').style.display='block';$('#ov').innerHTML=`<div class=modal><h3>Cambia PIN</h3><input id=p0 type=password inputmode=numeric placeholder="PIN attuale"><input id=p1 type=password inputmode=numeric placeholder="Nuovo PIN (min. 4 caratteri)"><div class=row><button onclick="closeF()">Annulla</button><button class=pri style="margin:0" onclick="chPin2()">Salva</button></div></div>`}
async function chPin2(){if(await hs($('#p0').value)!==S.pin)return toast('PIN attuale errato');const p=$('#p1').value;if(p.length<4)return toast('Il nuovo PIN deve avere almeno 4 caratteri');S.pin=await hs(p);save();stay();closeF();toast('PIN aggiornato')}
function newRc(){$('#ov').style.display='block';$('#ov').innerHTML=`<div class=modal><h3>Nuovo codice di recupero</h3><p class=m>Il vecchio codice smetterà di funzionare.</p><input id=p0 type=password inputmode=numeric placeholder="PIN attuale"><div class=row><button onclick="closeF()">Annulla</button><button class=pri style="margin:0" onclick="newRc2()">Genera</button></div></div>`}
async function newRc2(){if(await hs($('#p0').value)!==S.pin)return toast('PIN errato');closeF();showRc()}
const stay=()=>{try{localStorage.setItem(KI,S.pin)}catch(e){}},out=()=>{unlocked=false;try{localStorage.removeItem(KI)}catch(e){}render()};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
function ask(m,f){const o=$('#ov2');o.style.display='block';o.innerHTML=`<div class=modal style="margin-top:30vh"><p>${esc(m)}</p><div class=row><button onclick="$('#ov2').style.display='none'">No</button><button class=pri style="margin:0" id=yes>Sì</button></div></div>`;$('#yes').onclick=()=>{o.style.display='none';f()}}
/* passkey: sblocco locale con impronta o volto, funziona solo online in https */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function pkSet(){if(S.pk){S.pk=null;save();toast('Passkey disattivata');return render()}
try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Vinyl HQ'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'io',displayName:'Vinyl HQ'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'preferred',userVerification:'required'},timeout:60000}});S.pk=b64(c.rawId);save();toast('Passkey attivata');render()}catch(e){toast('Passkey non disponibile qui: serve il sito online in https')}}
async function pkIn(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub(S.pk)}],userVerification:'required',timeout:60000}});stay();unlocked=true;render()}catch(e){toast('Passkey non riuscita')}}

/* ---- contabilità ----
 Guadagno di un disco = vendita − (acquisto + spedizione + boost), qualunque sia la fonte dei soldi.
 Guadagno netto = somma dei guadagni − spese varie.
 Saldo Vinted = vendite Vinted − acquisti pagati con saldo − boost − spese dal saldo − prelievi.
 Miei soldi = prelievi + vendite su altre app − acquisti pagati con i miei soldi − spese dai miei soldi
             (negativo: ancora da recuperare; positivo: recuperato tutto e questo è in più). */
function mov(){const m=[];
S.sales.filter(isV).forEach(s=>{const x=rec(s.rec);m.push({d:s.date,t:'Vendita '+(x?x.code:''),a:+s.price,k:'sale'})});
S.recs.filter(x=>x.src=='vinted').forEach(x=>m.push({d:x.date,t:'Acquisto '+x.code,a:-acq(x),k:'buy'}));
S.recs.forEach(x=>x.boosts.forEach(b=>m.push({d:b.date,t:'Boost '+x.code,a:-(+b.amt||0),k:'boost',id:b.id,rec:x.id})));
S.exp.filter(e=>e.src=='vinted').forEach(e=>m.push({d:e.date,t:'Spesa: '+e.desc,a:-(+e.amt||0),k:'exp',id:e.id}));
S.wd.forEach(w=>m.push({d:w.date,t:'Prelievo',a:-w.amt,k:'wd'}));
return m.sort((a,b)=>b.d.localeCompare(a.d))}
function movMe(){const m=[];
S.wd.forEach(w=>m.push({d:w.date,t:'Prelievo da Vinted',a:+w.amt,k:'wd'}));
S.sales.filter(s=>!isV(s)).forEach(s=>{const x=rec(s.rec);m.push({d:s.date,t:'Vendita '+(x?x.code:'')+' su '+s.app,a:+s.price,k:'sale'})});
S.recs.filter(x=>x.src=='me').forEach(x=>m.push({d:x.date,t:'Acquisto '+x.code,a:-acq(x),k:'buy'}));
S.exp.filter(e=>e.src=='me').forEach(e=>m.push({d:e.date,t:'Spesa: '+e.desc,a:-(+e.amt||0),k:'exp',id:e.id}));
return m.sort((a,b)=>b.d.localeCompare(a.d))}
const bal=()=>sum(mov(),m=>m.a),
pocket=()=>sum(movMe(),m=>m.a),
profit=()=>sum(S.sales,v=>{const x=rec(v.rec);return x?v.price-tot(x):0}),
expT=()=>sum(S.exp,e=>e.amt),
profitNet=()=>profit()-expT(),
backupAge=()=>{if(!S.lastExp)return -1;const d=Math.round((Date.now()-new Date(S.lastExp))/864e5);return d>30?d:null};
function nextCode(){const y=String(new Date().getFullYear()).slice(2),ns=S.recs.map(x=>String(x.code)).filter(c=>c.startsWith(y)&&/^\d+$/.test(c)).map(c=>c.slice(2));const len=Math.max(3,...ns.map(n=>n.length)),mx=Math.max(0,...ns.map(Number));return y+String(mx+1).padStart(len,'0')}

/* ---- grafici (SVG, nessuna libreria) ---- */
function months(n){const o=[],d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);o.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}return o}
const ML=k=>'GFMAMGLASOND'[+k.slice(5)-1];
function bars(labels,series,names){const W=360,H=150,p={l:4,r:4,t:14,b:18},iw=W-p.l-p.r,ih=H-p.t-p.b,gw=iw/labels.length,n=series.length,bw=Math.min(9,(gw-6)/n),mx=Math.max(1,...series.flat());let s='';
labels.forEach((k,i)=>{const x0=p.l+i*gw+(gw-bw*n)/2;series.forEach((sv,j)=>{const v=sv[i]||0,h=v/mx*ih;s+=`<rect class="b${j}" x="${(x0+j*bw).toFixed(1)}" y="${(p.t+ih-h).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${h.toFixed(1)}" rx="1"/>`});s+=`<text x="${(p.l+i*gw+gw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${ML(k)}</text>`});
return `<svg class=ch viewBox="0 0 ${W} ${H}"><line x1="${p.l}" x2="${W-p.r}" y1="${p.t+ih}" y2="${p.t+ih}" class=ax/>${s}<text x="${p.l}" y="10">max ${E(mx)}</text></svg><div class=lg>${names.map((nm,j)=>`<span><i class="b${j}"></i>${nm}</span>`).join('')}</div>`}
function lineCh(labels,vals){const W=360,H=120,p={l:4,r:4,t:14,b:18},iw=W-p.l-p.r,ih=H-p.t-p.b,mx=Math.max(...vals,0),mn=Math.min(...vals,0),rg=(mx-mn)||1,X=i=>p.l+i*(iw/(labels.length-1||1)),Y=v=>p.t+ih-(v-mn)/rg*ih,pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`),y0=Y(0).toFixed(1);
return `<svg class=ch viewBox="0 0 ${W} ${H}"><line x1="${p.l}" x2="${W-p.r}" y1="${y0}" y2="${y0}" class=ax/><path class=area d="M${pts[0]} L${pts.join(' L')} L${X(vals.length-1).toFixed(1)},${y0} L${X(0).toFixed(1)},${y0}Z"/><polyline class=ln points="${pts.join(' ')}"/>${labels.map((k,i)=>`<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="middle">${ML(k)}</text>`).join('')}<text x="${p.l}" y="10">${E(mn)} … ${E(mx)}</text></svg>`}

/* ---- viste ---- */
const V={

rowv=x=>`<div class="rw ${x.sold?'sold':''}" onclick="recForm('${x.id}')"><b>${esc(x.code)}</b><span class=n>${esc(x.artist)} — ${esc(x.title)}</span><span class=p>${E(tot(x))}${+x.est?`<br><span class=m>stima ${E(x.est)}</span>`:''}</span></div>`,
cmpCode=(a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true});
function lst(){const t=q.toLowerCase(),u=S.ui,srt={code:(a,b)=>cmpCode(b,a),codeAsc:cmpCode,date:(a,b)=>b.date.localeCompare(a.date),est:(a,b)=>(+b.est||0)-(+a.est||0),pot:(a,b)=>pot(b)-pot(a),age:(a,b)=>a.date.localeCompare(b.date)},
r=S.recs.filter(x=>(flt=='all'||(flt=='sold'&&x.sold)||(flt=='keep'&&x.keep&&!x.sold)||(flt=='free'&&!x.sold&&!x.keep))&&(x.code+' '+x.artist+' '+x.title).toLowerCase().includes(t)).sort(srt[u.sort]||srt.code);
$('#list').innerHTML=`<p class=m>${r.length} dischi · stima dei dischi che hai ${E(sum(S.recs.filter(x=>!x.sold),x=>x.est))}</p>`+(r.length?r.map(u.view=='row'?rowv:card).join(''):'<p class=m>Nessun disco. Premi “Aggiungi disco” per iniziare.</p>')}
function recForm(id,tpl){const x=tpl||rec(id)||{fmt:'LP',src:'me',code:nextCode(),boosts:[]};ed=tpl?null:(id||null);
const ck=(k,l)=>`<label class=ck><input type=checkbox id=f_${k} ${x[k]?'checked':''}>${l}</label>`;
$('#ov').style.display='block';
$('#ov').innerHTML=`<div class=modal><h3>${tpl?'Duplica disco':id?'Modifica disco':'Nuovo disco'}</h3>
<input id=f_code placeholder="Codice (es. 26001)" value="${esc(x.code)}"><input id=f_artist placeholder="Artista" value="${esc(x.artist)}"><input id=f_title placeholder="Nome album" value="${esc(x.title)}">
<select id=f_fmt><option ${x.fmt=='LP'?'selected':''}>LP</option><option ${x.fmt=='CD'?'selected':''}>CD</option></select>
<div class=row><input id=f_buy type=number step=0.01 placeholder="Prezzo €" value="${x.buy??''}" oninput="tt()"><input id=f_ship type=number step=0.01 placeholder="Spedizione €" value="${x.ship??''}" oninput="tt()"></div>
<p class=m>Totale: <b id=f_tot>${E(acq(x))}</b>${bst(x)?' + boost '+E(bst(x)):''}</p>
<select id=f_src><option value=me ${x.src!='vinted'?'selected':''}>Pagato con i miei soldi</option><option value=vinted ${x.src=='vinted'?'selected':''}>Pagato con saldo Vinted</option></select>
<div class=row><input id=f_est type=number step=0.01 placeholder="Valore stimato €" value="${x.est??''}"><label class=m>Data acquisto<input id=f_date type=date value="${x.date||today()}"></label></div>
<input id=f_cov placeholder="Link copertina" value="${esc(x.cov)}"><button class=w onclick="findCov()">Cerca copertina automatica</button><p class=m id=f_cm></p>
<textarea id=f_note placeholder="Note (opzionale)">${esc(x.note)}</textarea>
${ck('keep','Per collezione (non in vendita)')}${ck('signed','Autografato')}${ck('sealed','Sigillato')}${ck('alt','Edizione alternativa')}
<div class=row><button onclick="closeF()">Annulla</button><button class=pri style="margin:0" onclick="saveRec()">Salva</button></div></div>`}
const tt=()=>$('#f_tot').textContent=E((+$('#f_buy').value||0)+(+$('#f_ship').value||0)),
closeF=()=>{$('#ov').style.display='none';$('#ov').innerHTML='';render()};
function saveRec(){const g=i=>$('#f_'+i);
const d={code:g('code').value.trim(),artist:g('artist').value.trim(),title:g('title').value.trim(),fmt:g('fmt').value,buy:+g('buy').value||0,ship:+g('ship').value||0,src:g('src').value,keep:g('keep').checked,est:+g('est').value||0,cov:g('cov').value.trim(),date:g('date').value||today(),note:g('note').value.trim(),signed:g('signed').checked,sealed:g('sealed').checked,alt:g('alt').checked};
if(!d.code||!d.artist||!d.title)return toast('Codice, artista e nome album sono obbligatori');
if(S.recs.some(r=>r.code==d.code&&r.id!=ed))return toast('Questo codice esiste già');
if(ed)Object.assign(rec(ed),d);else S.recs.unshift({id:uid(),sold:false,soldTo:'',boosts:[],...d});
save();closeF();toast('Disco salvato')}
function dupRec(id){const s=rec(id);if(!s)return;recForm(null,{...s,code:nextCode(),boosts:[],sold:false,soldTo:'',date:today()})}
function delRec(id){if(S.sales.some(s=>s.rec==id))return toast('Prima annulla la vendita di questo disco');ask('Eliminare il disco? Spariscono anche i suoi boost.',()=>{S.recs=S.recs.filter(r=>r.id!=id);save();render()})}

/* ---- boost e spese varie ---- */
function boostF(id){const x=rec(id);if(!x)return;$('#ov').style.display='block';
$('#ov').innerHTML=`<div class=modal><h3>Boost · ${esc(x.code)}</h3><p class=m>${esc(x.artist)} — ${esc(x.title)}</p>
<div class=row><input id=b_a type=number step=0.01 placeholder="Importo €"><input id=b_d type=date value="${today()}"></div><button class=pri onclick="addBoost('${id}')">Aggiungi boost</button>
${x.boosts.length?x.boosts.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(b=>`<div class=line><span>${b.date}</span><span><b>${E(b.amt)}</b> <button class=x onclick="delBoost('${id}','${b.id}')">×</button></span></div>`).join(''):'<p class=m>Nessun boost su questo disco.</p>'}
<p class=m>Totale boost <b>${E(bst(x))}</b>. Scende dal saldo Vinted e si somma al costo del disco, quindi ne abbassa il guadagno.</p><button class=w onclick="closeF()">Chiudi</button></div>`}
function addBoost(id){const a=+$('#b_a').value;if(!(a>0))return toast('Inserisci un importo');rec(id).boosts.push({id:uid(),amt:a,date:$('#b_d').value||today()});save();boostF(id);toast('Boost registrato')}
function addBoostV(){const id=$('#v_rec').value,a=+$('#v_a').value;if(!id||!(a>0))return toast('Scegli il disco e l\'importo');rec(id).boosts.push({id:uid(),amt:a,date:$('#v_d').value||today()});save();render();toast('Boost registrato')}
function delBoost(id,bid){const x=rec(id);x.boosts=x.boosts.filter(b=>b.id!=bid);save();$('#ov').style.display=='block'?boostF(id):render()}
function addExp(){const t=$('#e_t').value.trim(),a=+$('#e_a').value;if(!t||!(a>0))return toast('Scrivi la descrizione e l\'importo');S.exp.unshift({id:uid(),desc:t,amt:a,date:$('#e_d').value||today(),src:$('#e_s').value});save();render();toast('Spesa registrata')}
function delExp(id){ask('Eliminare questa spesa?',()=>{S.exp=S.exp.filter(e=>e.id!=id);save();render()})}

/* ---- vendite e prelievi ---- */
function addSale(){const r=$('#s_rec').value,app=$('#s_app').value.trim(),acc=$('#s_acc').value.trim(),pv=$('#s_p').value;
if(!r||!app||pv==='')return toast('Scegli il disco, l\'app e il prezzo');
const n=Math.max(0,...S.sales.filter(s=>s.app.toLowerCase()==app.toLowerCase()&&(s.acc||'').toLowerCase()==acc.toLowerCase()).map(s=>s.n))+1;
S.sales.unshift({id:uid(),rec:r,app,acc,n,price:+pv,date:$('#s_d').value||today()});
const x=rec(r);x.sold=true;x.soldTo=$('#s_b').value.trim();save();render();toast('Vendita registrata')}
function delSale(id){ask('Annullare la vendita? Il disco torna disponibile.',()=>{const s=S.sales.find(v=>v.id==id),x=rec(s.rec);if(x){x.sold=false;x.soldTo=''}S.sales=S.sales.filter(v=>v.id!=id);save();render()})}
function addWd(){const a=+$('#w_a').value;if(!(a>0))return toast('Inserisci un importo');const go_=()=>{S.wd.unshift({id:uid(),amt:a,date:$('#w_d').value||today()});save();render()};a>bal()?ask('Il prelievo supera il saldo Vinted. Registrarlo comunque?',go_):go_()}
function delWd(id){S.wd=S.wd.filter(w=>w.id!=id);save();render()}

function growth(){const sd={};S.sales.forEach(v=>sd[v.rec]=v.date);const g=[];if(!S.recs.length)return g;
const mn=S.recs.map(x=>x.date).sort()[0].slice(0,7).split('-').map(Number),mx=today().slice(0,7).split('-').map(Number);
for(let n=mn[0]*12+mn[1]-1;n<=mx[0]*12+mx[1]-1;n++){const k=Math.floor(n/12)+'-'+String(n%12+1).padStart(2,'0'),e=k+'-31',o=S.recs.filter(x=>x.date<=e&&!(sd[x.id]&&sd[x.id]<=e));g.push({k,n:o.length,v:sum(o,x=>x.est)})}return g}
/* ---- copertine (MusicBrainz + Cover Art Archive, gratuiti) ---- */
async function findCov(){const a=$('#f_artist').value.trim(),t=$('#f_title').value.trim(),m=$('#f_cm');
if(!a||!t)return m.textContent='Inserisci prima artista e album';m.textContent='Cerco…';
try{const j=await(await fetch('https://musicbrainz.org/ws/2/release/?fmt=json&limit=5&query='+encodeURIComponent(`artist:"${a}" AND release:"${t}"`))).json();
for(const r of j.releases||[]){const u=`https://coverartarchive.org/release/${r.id}/front-250`;
const ok=await new Promise(o=>{const i=new Image();i.onload=()=>o(1);i.onerror=()=>o(0);i.src=u});
if(ok){$('#f_cov').value=u;return m.textContent='Copertina trovata'}}
m.textContent='Nessuna copertina trovata: incolla un link a mano'}catch(e){m.textContent='Ricerca non riuscita. Incolla un link a mano'}}
/* ---- backup ed esportazioni ---- */
function dl(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click()}
function exp(){dl('vinyl-hq-backup.json',JSON.stringify({v:2,recs:S.recs,sales:S.sales,wd:S.wd,exp:S.exp,goal:S.goal||0}),'application/json');S.lastExp=today();save();render();toast('Backup esportato')}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.recs))throw 0;
const go_=()=>{S.recs=d.recs;S.sales=d.sales||[];S.wd=d.wd||[];S.exp=d.exp||[];if(d.goal)S.goal=d.goal;S.recs.forEach(norm);save();render();toast(`Importati ${S.recs.length} dischi e ${S.sales.length} vendite`)};
S.recs.length?ask('Sostituire i dati attuali con quelli del backup?',go_):go_()}catch(e){toast('File non valido')}};r.readAsText(f);i.value=''}
const csv=rows=>'﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n'),
num=n=>(+n||0).toFixed(2).replace('.',','),si=b=>b?'sì':'no';
function csvRecs(){const sm={};S.sales.forEach(s=>sm[s.rec]=s);const rows=[['Codice','Artista','Album','Formato','Data acquisto','Prezzo','Spedizione','Boost','Costo totale','Pagato con','Stima','Potenziale','Per collezione','Autografato','Sigillato','Ed. alternativa','Venduto','Venduto a','Data vendita','App','Prezzo vendita','Guadagno','Note']];
S.recs.slice().sort(cmpCode).forEach(x=>{const s=sm[x.id];rows.push([x.code,x.artist,x.title,x.fmt,x.date,num(x.buy),num(x.ship),num(bst(x)),num(tot(x)),x.src=='vinted'?'Saldo Vinted':'Miei soldi',num(x.est),x.sold?'':num(pot(x)),si(x.keep),si(x.signed),si(x.sealed),si(x.alt),si(x.sold),x.soldTo,s?s.date:'',s?s.app:'',s?num(s.price):'',s?num(s.price-tot(x)):'',x.note])});
dl('vinyl-hq-dischi.csv',csv(rows),'text/csv;charset=utf-8')}
function csvSales(){const rows=[['N° ordine','App','Account','Data','Codice','Artista','Album','Prezzo vendita','Costo disco','Guadagno','Venduto a']];
S.sales.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{const x=rec(s.rec)||{};rows.push([s.n,s.app,s.acc,s.date,x.code,x.artist,x.title,num(s.price),num(tot(x)),num(s.price-tot(x)),x.soldTo])});
dl('vinyl-hq-vendite.csv',csv(rows),'text/csv;charset=utf-8')}
let ip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;if(unlocked&&tab=='set')render()});addEventListener('appinstalled',()=>{ip=null;toast('Vinyl HQ installata');if(unlocked)render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
